let stepRR = 0;
setInterval(async () => {
  if (!dev || busy || dragging || document.hidden || !dev.dump || !dev.link.idle) return;
  if (needReload) { maybeReload(); return; }
  if (dev.watch && Date.now() - lastDump < 5000) return;
  busy++;
  const d = dev;
  try {
    const dump = await getDump();
    if (d !== dev) return;
    const soundChanged = dump.engine !== d.dump.engine || dump.preset !== d.dump.preset;
    const engineChanged = dump.engine !== d.dump.engine;
    const oldLen = d.dump.p[pSlen()];
    for (const [k, c] of ctl) {
      const v = c.scope ? dump.g[c.id] : dump.p[c.id];
      if (touched(k)) { (c.scope ? dump.g : dump.p)[c.id] = c.scope ? d.dump.g[c.id] : d.dump.p[c.id]; continue; }
      showValue(k, v, false);
    }
    d.dump = dump;
    if (engineChanged) await rereadEngineDesc();
    if (hasTracks()) await readMixer();             /* the strips (other tracks push nothing) */
    if (soundChanged) { updateBrowser(); await loadSteps(); sayK("ready"); return; }
    if (dump.p[pSlen()] !== oldLen) { $("steptables").dataset.len = ""; renderSteps(); }
    if (d.watch) return;                            /* steps come as STEP_CHANGED */
    /* steps are not in DUMP: follow them two at a time */
    const len = Math.max(1, Math.min(d.info.nstep, dump.p[pSlen()] || 16));
    for (let n = 0; n < 2; n++) {
      stepRR = (stepRR + 1) % len;
      if (performance.now() - (stepEdit.get(stepRR) || 0) < 1500) continue;
      const s = await getStep(stepRR);
      const o = d.steps[stepRR];
      d.steps[stepRR] = s;
      if (JSON.stringify(o) !== JSON.stringify(s)) updateStepRows();
    }
  } catch (err) { report(err); } finally { busy--; }
}, 400);

/* Patches live in IndexedDB "felucca-editor": store "patches" (by id), store "meta" ("layout": the
   parameter keys / engine names the stored values are in). Without IndexedDB (some private windows)
   the library is kept in memory only. */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res) => {
    try {
      const r = indexedDB.open("felucca-editor", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("patches", { keyPath: "id" }); r.result.createObjectStore("meta"); };
      r.onsuccess = () => res(r.result);
      r.onerror = r.onblocked = () => res(null);
    } catch (e) { res(null); }
  }));
  const tx = async (name, mode, fn) => {
    const db = await open();
    if (!db) return undefined;
    return new Promise((res, rej) => {
      const x = db.transaction(name, mode);
      let out;
      const r = fn(x.objectStore(name));
      if (r) r.onsuccess = () => { out = r.result; };
      x.oncomplete = () => res(out);
      x.onerror = x.onabort = () => rej(x.error || new Error("IndexedDB"));
    });
  };
  return {
    ok: async () => !!(await open()),
    all: () => tx("patches", "readonly", (os) => os.getAll()),
    putMany: (ps) => tx("patches", "readwrite", (os) => { ps.forEach((p) => os.put(p)); }),
    del: (id) => tx("patches", "readwrite", (os) => os.delete(id)),
    getMeta: (k) => tx("meta", "readonly", (os) => os.get(k)),
    setMeta: (k, v) => tx("meta", "readwrite", (os) => os.put(v, k)),
  };
})();

  : { keys: libMeta.keys, engines: libMeta.engines, firmware: "", pe0: libMeta.pe0 });

async function libInit() {
  try {
    libPersistent = await store.ok();
    if (libPersistent) {
      lib = ((await store.all()) || []).filter((p) => p && p.id);
      libMeta = (await store.getMeta("layout")) || libMeta;
    }
  } catch (e) { console.warn(e); libPersistent = false; }
  renderLib();
}
async function libWrite(ps) {

}

  lib.push(...add);
  if (add.length) libSel = add[add.length - 1].id;

/* the device's parameter layout becomes the library's; patches stored with another layout are mapped by key */
async function libAdopt(d) {
  const keys = d.keys, engines = d.info.engines, changed = [];
  if ((libMeta.keys && !sameKeys(libMeta.keys, keys)) || (libMeta.engines && !sameKeys(libMeta.engines, engines))) {
    for (const p of lib) {
      const name = p.engineName || (libMeta.engines || [])[p.engine];
      const e = name ? engines.indexOf(name) : p.engine;
      p.p = remapParams(p.p, libMeta.keys, keys);
      if (e >= 0) { p.engine = e; p.engineName = engines[e]; }
      changed.push(p);
    }
  }
  libMeta = { keys, engines, pe0: d.info.pe0 };
  if (changed.length) await libWrite(changed);
  try { await store.setMeta("layout", libMeta); } catch (e) { console.warn(e); }
  renderLib();
}

function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const fileSlug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "patch";
const today = () => new Date().toISOString().slice(0, 10);
/* v5 (Jangada, after SLOOP 2.3 and Felucca 1.0.1): the complete backup and its restore. The work is in
   fm1backup.js (the installer uses it too, for the backup before the return to the official firmware). */
const backupModule = () => import("./fm1backup.js");
function bkProgress(key) {
  const pr = $("bk-prog");
  pr.hidden = false;
  pr.value = 0;
  return (d, n) => { pr.value = d / n; sayK(key, `${Math.round(100 * d / n)} %`); };
}
function bkReport(e) {
  if (e && e.code && TEXT[lang][e.code]) sayK(e.code, e.code === "bkStop" ? "" : e.message);
  else report(e);
}
$("bk-save").addEventListener("click", () => op(async () => {
  try {
    const B = await backupModule(), name = B.backupName();
    download(name, await B.captureBackup(rq, dev.info.version, bkProgress("bkSaving")));
    sayK("bkSaved", name);
  } catch (e) { bkReport(e); } finally { $("bk-prog").hidden = true; }
}));
$("bk-load").addEventListener("click", () => { if (dev) { $("bk-file").value = ""; $("bk-file").click(); } });
$("bk-file").addEventListener("change", async () => {
  const f = $("bk-file").files[0];
  if (!f || !dev) return;
  let B, file;
  try { B = await backupModule(); file = B.readBackup(await f.text()); }   /* every byte checked before anything is written */
  catch (e) { bkReport(e.code ? e : Object.assign(e, { code: "bkBad" })); return; }
  if (!confirm(t("bkConfirm"))) return;
  await op(async () => {
    try {
      selfLoad();
      await B.restoreBackup(rq, file, bkProgress("bkRestoring"), { ids: B.backupIds(dev.info.proto) });
    } catch (e) { bkReport(e); return; } finally { $("bk-prog").hidden = true; }
    for (let k = 0; k < 4; k++) dev.slotUsed[k] = parse[CMD.PROJECT](await rq(req.project(2, k))).used;
    renderSlots();
    try { await smpInfo(); renderSamples(); } catch (e) { /* shown by the next action */ }
    if (dev.bank) { dev.bank = await bank.list((r, o) => rq(r, { ...o, quiet: true })); renderBank(); }
    await afterSoundChange("bkRestored");
  });
});
$("libexp1").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (p) download(`jangada-patch-${fileSlug(p.name)}.json`, libraryFile("patch", [p], libCtx()));
});
$("libexport").addEventListener("click", () => download(`jangada-library-${today()}.json`, libraryFile("library", lib, libCtx())));
$("libimport").addEventListener("click", () => { $("libfile").value = ""; $("libfile").click(); });
$("libfile").addEventListener("change", async () => {
  let n = 0, skipped = 0;
  for (const f of [...$("libfile").files]) {
    try {
      const obj = JSON.parse(await f.text());
      const ctx = libCtx();
      const r = readLibraryFile(obj, ctx);
      if (!ctx.keys && r.keys) {                     /* no layout yet: the file's becomes the library's */
        libMeta = { keys: r.keys, engines: Array.isArray(obj.engines) ? obj.engines : null, pe0: obj.pE0 ?? null };
        try { await store.setMeta("layout", libMeta); } catch (e) { console.warn(e); }
      }
      if (obj.kind === "bank") r.patches.forEach((p) => { if (!p.tags.includes("bank")) p.tags.push("bank"); });
      await libAdd(r.patches);
      n += r.patches.length;
      skipped += r.skipped;
    } catch (e) { sayK("badfile", `${f.name}: ${e.message}`); return; }
  }
  sayK("imported", n + (skipped ? t("skippedN").replace("{n}", skipped) : t("patchesN")));
});

/* device bank */
function bankLoad(slot) {
  if (!dev || !dev.bank || slot == null || libBusy) return;
  const s = dev.bank.slots[slot];
  libOp(async () => {
    selfLoad();
    const rc = await bank.load(rqf, slot);
    if (rc) { sayK("emptySlot", slotName(slot)); return; }
    await afterSoundChange();
    sayK("loadedUser", `${slotName(slot)} ${s.name}`);
  });
}
$("bkload").addEventListener("click", () => bankLoad(bankSel));
$("bkstore").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  const s = dev.bank.slots[slot];
  const name = prompt(t("promptNameAuto"), s.used ? s.name : "");
  if (name == null) return;
  if (s.used && !confirm(t("confirmOverwrite").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async () => {
    checkRc(await bank.store(rqf, slot, name.trim()));
    await refreshSlot(slot);
    sayK("storedSlot", `${slotName(slot)} ${dev.bank.slots[slot].name}`);
  });
});
function bankGet(slot) {
  if (!dev || !dev.bank || slot == null || libBusy) return;
  libOp(async () => {
    const u = await bank.get(rqf, dev.info, slot);
    if (!u.used) { sayK("emptySlot", slotName(slot)); return; }
    await libAdd([{ name: u.name, engine: u.engine, engineName: dev.info.engines[u.engine], p: u.p, pattern: u.pattern, tags: ["device"] }]);
    sayK("copiedLib", u.name);
  });
}
$("bkget").addEventListener("click", () => bankGet(bankSel));
$("bkerase").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  const s = dev.bank.slots[slot];
  if (!s.used || !confirm(t("confirmEraseSlot").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async () => {
    checkRc(await bank.erase(rqf, slot));
    await refreshSlot(slot);
    sayK("erasedSlot", slotName(slot));
  });
});
$("bkrefresh").addEventListener("click", () => libOp(async () => {
  sayK("readingBank");
  dev.bank = await bank.list(rqf);
  sayK("ready");
}));
$("bkexport").addEventListener("click", () => libOp(async () => {
  const out = [];
  for (const x of dev.bank.slots) {
    if (!x.used) continue;
    sayK("readingBank", ` ${slotName(x.slot)}`);
    const u = await bank.get(rqf, dev.info, x.slot);
    if (u.used) out.push({ name: u.name, engine: u.engine, engineName: dev.info.engines[u.engine], p: u.p, pattern: u.pattern, slot: x.slot });
  }
  download(`jangada-bank-${today()}.json`, libraryFile("bank", out, libCtx()));
  sayK("ready");
}));

/* ------------------------------------------------------------------ FM6 --- */
/* The 6-OP FM tab (firmware with FM6 patches: INFO's 46 01 tag; after Felucca 1.0's): the whole patch of an FM6
   track, which the device's knobs only reach through its macros. Read a track's patch or a slot, edit it, send it
   to a track (live while editing), store it in the bank (B1..B32), import the DX7-format SysEx files (one voice,
   or a bank of 32: all of it into B1..B32 at once), export them. */
let fm6v = FM6.init();                 /* the patch being edited (155 bytes) */
let fm6Imported = [];                  /* voices of the last imported file: [{name, v}] */
let fm6ImportedBank = false;           /* ... and it was one 32-voice bank */
let fm6List = null;                    /* FM6_LIST of the device */
let fm6Seen = false;                   /* the tab was opened on this connection (the selected track read once) */
let fm6Timer = null;
const fm6Ok = () => !!dev && !!dev.info && !!dev.info.fm6;
const fm6Track = () => +$("fm6trk").value || 0;
const fm6SlotName = (i) => (i < dev.info.fm6.factory ? "F" + (i + 1) : "B" + (i - dev.info.fm6.factory + 1));
/* Jangada 0.6: the banks of 32 (INFO 46 03: two, B1..B32 and B33..B64); the one the bank buttons act on */
const fm6Banks = () => Math.max(1, Math.ceil(dev.info.fm6.bank / 32));
const fm6BankBase = () => 32 * Math.min(+$("fm6banksel").value || 0, fm6Banks() - 1);
const fm6Range = (base) => (lang === "ja" ? `B${base + 1}〜B${base + 32}` : `B${base + 1}..B${base + 32}`);
const FM6_WAVES = ["TRI", "SAW-", "SAW+", "SQR", "SIN", "S&H"];
const FM6_CURVES = ["-LIN", "-EXP", "+EXP", "+LIN"];
const fm6Rc = (rc) => {
  if (rc === 3) throw new Error(t("fm6Stop"));
  if (rc === 4) throw new Error(t("fm6Busy"));         /* a backup holds the device's buffer */
  if (rc === 5) throw new Error(t("fm6Lost"));         /* the staged half is gone (COMMIT), or the other half is staged */
  checkRc(rc);
};
function fm6Set(i, val) {
  fm6v[i] = Math.max(0, Math.min(FM6.max(i), Math.round(+val || 0)));
  if ($("fm6live").checked && fm6Ok()) {
    clearTimeout(fm6Timer);
    fm6Timer = setTimeout(() => op(() => fm6Send(true)), 150);
  }
}
function fm6Num(i, title) {
  return el("input", { type: "number", min: 0, max: FM6.max(i), value: fm6v[i], title, class: "fm6n",
    onchange: (e) => { fm6Set(i, e.target.value); e.target.value = fm6v[i]; renderFm6Ops(); } });
}
function fm6Sel(i, names, title) {
  const s = el("select", { title, onchange: (e) => { fm6Set(i, e.target.value); renderFm6(); } },
    ...names.map((n, k) => el("option", { value: k, text: n })));
  s.value = fm6v[i];
  return s;
}
function renderFm6Voice() {
  const V = FM6.VI, alg = fm6v[V.ALG], fb = FM6.feedbackOp(alg);
  const nm = el("input", { type: "text", maxlength: 10, value: FM6.name(fm6v), size: 11, spellcheck: "false",
    onchange: (e) => { FM6.setName(fm6v, e.target.value); fm6Set(0, fm6v[0]); e.target.value = FM6.name(fm6v); } });
  const row = (label, ...kids) => el("tr", {}, el("th", { text: label }), el("td", {}, ...kids));
  $("fm6voice").replaceChildren(el("table", {},
    row(t("name"), nm),
    row("ALG", fm6Sel(V.ALG, Array.from({ length: 32 }, (_, k) => String(k + 1)), "ALG"),
      el("span", { class: "dim", text: ` ${t("fm6Carriers")} ${FM6.carriers(alg).join(" ")} · ${t("fm6Feedback")} OP${fb}` })),
    row("FB", fm6Num(V.FB, "FB"), " OKS ", fm6Num(V.OKS, "OKS"), " TRNSP ", fm6Num(V.TRNSP, "TRNSP")),
    row("LFO", fm6Sel(V.LFW, FM6_WAVES, "WAVE"), " SPD ", fm6Num(V.LFS, "SPEED"), " DLY ", fm6Num(V.LFD, "DELAY"),
      " PMD ", fm6Num(V.LPMD, "PMD"), " AMD ", fm6Num(V.LAMD, "AMD"), " PMS ", fm6Num(V.LPMS, "PMS"), " SYNC ", fm6Num(V.LKS, "SYNC")),
    row(t("fm6PitchEg"), "R ", ...[0, 1, 2, 3].map((k) => fm6Num(V.PR1 + k, "R" + (k + 1))),
      " L ", ...[0, 1, 2, 3].map((k) => fm6Num(V.PL1 + k, "L" + (k + 1))))));
}
function renderFm6Ops() {
  const car = FM6.carriers(fm6v[FM6.VI.ALG]);
  const head = el("tr", {}, el("th", { text: "OP" }), ...FM6.OP.map(([n]) => el("th", { text: n })), el("th", { text: t("fm6Freq") }));
  const rows = [1, 2, 3, 4, 5, 6].map((n) => el("tr", {},
    el("th", { text: (car.includes(n) ? "● " : "") + n }),
    ...FM6.OP.map(([f]) => el("td", {}, f === "LC" || f === "RC" ? fm6Sel(FM6.at(n, f), FM6_CURVES, f)
      : f === "MODE" ? fm6Sel(FM6.at(n, f), ["RATIO", "FIXED"], f) : fm6Num(FM6.at(n, f), `OP${n} ${f}`))),
    el("td", { class: "dim", text: FM6.freqText(fm6v, n) })));
  $("fm6ops").replaceChildren(el("div", { class: "fm6ops" }, el("table", {}, head, ...rows)), el("p", { class: "dim", text: t("fm6Legend") }));
}
function renderFm6Imported() {
  const box = $("fm6imported");
  if (!fm6Imported.length) { box.replaceChildren(); return; }
  box.replaceChildren(el("p", { class: "dim", text: t("fm6Pick") }),
    el("p", { class: "bar" }, ...fm6Imported.map((x, k) => el("button", { type: "button", class: "tog", text: `${k + 1} ${x.name}`,
      onclick: () => { fm6v = Uint8Array.from(x.v); renderFm6(); sayK("fm6Picked", ` ${x.name}`); } }))),
    ...(fm6ImportedBank ? [el("p", { class: "bar" }, el("button", { type: "button", id: "fm6bankput", ic: "port_disk",
      text: t("fm6BankPut").replace("{range}", fm6Range(fm6BankBase())), onclick: fm6BankPut }))] : []));
}
function renderFm6() {
  if (!fm6Ok()) return;
  const ts = $("fm6trk"), keepT = ts.value, ss = $("fm6slot"), keepS = ss.value;
  ts.replaceChildren(...Array.from({ length: dev.info.ntrk || 1 }, (_, i) => el("option", { value: i, text: String(i + 1) })));
  ts.value = keepT || String(dev.sel ?? 0);
  const n = dev.info.fm6.factory + dev.info.fm6.bank;
  ss.replaceChildren(...Array.from({ length: n }, (_, i) => {
    const s = fm6List && fm6List.slots[i];
    return el("option", { value: i, text: `${fm6SlotName(i)} ${s && s.used ? s.name : t("empty")}` });
  }));
  if (keepS) ss.value = keepS;
  const bs = $("fm6banksel"), keepB = bs.value;                     /* the bank the bank buttons act on */
  bs.replaceChildren(...Array.from({ length: fm6Banks() }, (_, b) => el("option", { value: b, text: `${b + 1} (${fm6Range(32 * b)})` })));
  bs.value = keepB && +keepB < fm6Banks() ? keepB : "0";
  $("fm6banklbl").hidden = fm6Banks() < 2;
  renderFm6Voice();
  renderFm6Ops();
  renderFm6Imported();
}
async function fm6Refresh() {
  fm6List = parse[CMD.FM6_LIST](await rq(req.fm6List(), { timeout: 1500 }));
  renderFm6();
}
async function fm6ReadTrack(tr) {
  const r = parse[CMD.FM6_GET](await rq(req.fm6Get(FM6.TARGET.TRACK, tr)));
  fm6Rc(r.rc);
  fm6v = FM6.unpack(r.packed);
}
/* the tab opened: the slot names; the first time on this connection, the selected track's patch */
async function fm6Enter() {
  if (!fm6Ok()) return;
  await fm6Refresh();
  if (!fm6Seen) {
    fm6Seen = true;
    $("fm6trk").value = String(dev.sel ?? 0);
    await fm6ReadTrack(fm6Track());
    renderFm6();
  }
}
async function fm6Send(quiet) {
  const r = parse[CMD.FM6_PUT](await rq(req.fm6Put(FM6.TARGET.TRACK, fm6Track(), FM6.pack(fm6v)), { key: "fm6send" }));
  fm6Rc(r.rc);
  if (!quiet) sayK("fm6Sent", ` ${fm6Track() + 1}: ${FM6.name(fm6v)}`);
}
/* the 32 voices of an imported bank into the bank picked (B1..B32, or B33..B64 on firmware with INFO 46 03): staged
 * a half (16) at a time and committed (two flash writes, two short pauses of the audio: firmware with INFO 46 02),
 * or one slot after the other (each a flash write) on the firmware before it */
async function fm6BankPut() {
  if (!fm6Ok() || !fm6ImportedBank) return;
  const base = fm6BankBase(), range = fm6Range(base);
  if (!confirm(t("fm6BankConfirm").replace("{range}", range))) return;
  await op(async () => {
    const n = Math.min(fm6Imported.length, 32, dev.info.fm6.bank - base);
    for (let k = 0; k < n; k++) {
      sayK("fm6Storing", `B${base + k + 1} / ${range}`);
      const target = dev.info.fm6.batch ? FM6.TARGET.STAGE : FM6.TARGET.BANK;
      fm6Rc(parse[CMD.FM6_PUT](await rq(req.fm6Put(target, base + k, FM6.pack(fm6Imported[k].v)), { timeout: 3000, retries: 0 })).rc);
      if (dev.info.fm6.batch && (k % 16 === 15 || k === n - 1))
        fm6Rc(parse[CMD.FM6_COMMIT](await rq(req.fm6Commit(), { timeout: 3000, retries: 0 })).rc);
    }
    await fm6Refresh();
    sayK("fm6BankDone", range);
  });
}
$("fm6read").addEventListener("click", () => op(async () => {
  await fm6ReadTrack(fm6Track());
  renderFm6();
  sayK("fm6Read", ` ${fm6Track() + 1}: ${FM6.name(fm6v)}`);
}));
$("fm6send").addEventListener("click", () => op(() => fm6Send(false)));
$("fm6load").addEventListener("click", () => op(async () => {
  const i = +$("fm6slot").value, nf = dev.info.fm6.factory;
  const r = parse[CMD.FM6_GET](await rq(i < nf ? req.fm6Get(FM6.TARGET.FACTORY, i) : req.fm6Get(FM6.TARGET.BANK, i - nf)));
  if (r.rc === 2) { sayK("emptySlot", fm6SlotName(i)); return; }
  fm6Rc(r.rc);
  fm6v = FM6.unpack(r.packed);
  renderFm6();
  sayK("fm6Loaded", ` ${fm6SlotName(i)}: ${FM6.name(fm6v)}`);
}));
$("fm6store").addEventListener("click", () => {
  if (!fm6Ok()) return;
  const i = +$("fm6slot").value, nf = dev.info.fm6.factory;
  if (i < nf) { sayK("fm6Factory"); return; }
  const s = fm6List && fm6List.slots[i];
  if (s && s.used && !confirm(t("confirmOverwrite").replace("{n}", fm6SlotName(i)).replace("{name}", s.name))) return;
  op(async () => {
    fm6Rc(parse[CMD.FM6_PUT](await rq(req.fm6Put(FM6.TARGET.BANK, i - nf, FM6.pack(fm6v)), { timeout: 3000, retries: 0 })).rc);
    await fm6Refresh();
    sayK("storedSlot", fm6SlotName(i));
  });
});
$("fm6erase").addEventListener("click", () => {
  if (!fm6Ok()) return;
  const i = +$("fm6slot").value, nf = dev.info.fm6.factory;
  const s = fm6List && fm6List.slots[i];
  if (i < nf || !s || !s.used || !confirm(t("confirmEraseSlot").replace("{n}", fm6SlotName(i)).replace("{name}", s.name))) return;
  op(async () => {
    fm6Rc(parse[CMD.FM6_ERASE](await rq(req.fm6Erase(i - nf), { timeout: 3000, retries: 0 })).rc);
    await fm6Refresh();
    sayK("erasedSlot", fm6SlotName(i));
  });
});
$("fm6init").addEventListener("click", () => { fm6v = FM6.init(); renderFm6(); });
$("fm6banksel").addEventListener("change", () => renderFm6Imported());   /* (the "store all 32" button names the bank) */
$("fm6import").addEventListener("click", () => $("fm6file").click());
$("fm6file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = FM6.parseSysex(new Uint8Array(await f.arrayBuffer()));
  if (!r.voices.length) { sayK("badfile", f.name); return; }
  fm6Imported = r.voices;
  fm6ImportedBank = r.bank;
  if (r.voices.length === 1) fm6v = Uint8Array.from(r.voices[0].v);
  renderFm6();
  sayK("imported", `${f.name}: ${r.voices.length}` + (r.badSum ? ` (${t("fm6BadSum")})` : ""));
});
function downloadBytes(name, bytes) {
  const a = el("a", { href: URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" })), download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("fm6export").addEventListener("click", () => downloadBytes(`${fileSlug(FM6.name(fm6v))}.syx`, FM6.singleSysex(fm6v)));
$("fm6bankexp").addEventListener("click", () => op(async () => {
  const out = [], base = fm6BankBase();                 /* the bank picked: 32 voices, one DX7 bank file */
  for (let k = base; k < Math.min(base + 32, dev.info.fm6.bank); k++) {
    const r = parse[CMD.FM6_GET](await rq(req.fm6Get(FM6.TARGET.BANK, k)));
    out.push(r.rc ? null : FM6.unpack(r.packed));
  }
  downloadBytes(`jangada-fm6-bank${base ? 2 : 1}-${today()}.syx`, FM6.bankSysex(out));
  sayK("fm6Exported");
}));

$("connect").addEventListener("click", () => {
  if (dev) { wantConnected = false; disconnect(); } else connect();
});
applyLang();
showTab(tab);
libInit();
if (!MOCK && !navigator.requestMIDIAccess) sayK("nomidi");
})();
</script>
