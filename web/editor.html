<!-- Felucca web editor. One file, no libraries. Protocol: EDITOR_PROTOCOL.md.
     Add ?mock=1 to the URL to use a built-in simulated device. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jangada Editor</title>
<style>
  /* Fukiai: Hügelton Instruments' icon font (MIT, FUKIAI-LICENSE.txt). Icons are text in .ic spans;
     they stay hidden until the face has loaded (html.fk), so a missing font never shows boxes. */
  @font-face { font-family: "Fukiai"; src: url("fukiai.ttf") format("truetype"); font-display: block; unicode-range: U+EA00-EB09; }
  :root { --bg: #fff; --fg: #000; --dim: #777; --line: #ccc; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --fg: #fff; --dim: #888; --line: #444; }
  }
  :root[data-theme="dark"] { --bg: #000; --fg: #fff; --dim: #888; --line: #444; }
  html { color-scheme: light dark; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         font-variant-numeric: tabular-nums; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; padding-bottom: 2px; border-bottom: 1px solid var(--fg); }
  h3 { font-size: 11px; font-weight: 400; color: var(--dim); margin: 4px 0 0; }
  a { color: inherit; }
  .lang { float: right; font-size: 12px; color: var(--dim); text-decoration: underline; background: none; padding: 0; }
  button { font: inherit; background: var(--fg); color: var(--bg); border: 0; padding: 2px 10px; cursor: pointer; }
  button:disabled { opacity: .3; cursor: default; }
  button.lang { color: var(--dim); background: none; }
  select, input[type=text], input[type=number], input[type=search] {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 1px 3px; border-radius: 0; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--fg); }
  input[type=checkbox] { accent-color: var(--fg); margin: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 0 0 8px; }
  .dim { color: var(--dim); }
  #status { min-height: 1.4em; }
  section { margin: 12px 0; }
  .groups { columns: 250px; column-gap: 20px; }
  .group { break-inside: avoid; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 46px 1fr 70px; gap: 6px; align-items: center; min-height: 22px; }
  .row .v { text-align: right; white-space: nowrap; }
  .row select { width: 100%; }
  .browser { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .browser select[size] { min-width: 150px; }
  .slots { display: grid; grid-template-columns: auto auto auto auto; gap: 3px 8px; align-items: center; justify-content: start; }
  table { border-collapse: collapse; }
  th { font-weight: 400; color: var(--dim); text-align: left; padding: 0 6px 2px 0; }
  td { padding: 1px 6px 1px 0; }
  td.i { color: var(--dim); text-align: right; }
  #steps input[type=text] { width: 120px; }
  #steps input[type=number] { width: 48px; }
  #steps .bad { outline: 1px solid var(--fg); text-decoration: underline wavy; }
  #steps tr.off td { color: var(--dim); }
  .stepcols { columns: 470px; column-gap: 24px; }
  .stepcols table { break-inside: avoid; }
  @media (max-width: 600px) {
    .stepcols { columns: auto; overflow-x: auto; }
    #steps input[type=text] { width: 84px; }
    #steps input[type=number] { width: 42px; }
    #steps th, #steps td { padding-right: 3px; }
  }
  .smp { margin: 0 0 14px; padding: 6px 0 0; border-top: 1px solid var(--line); }
  .smp.over { outline: 1px solid var(--fg); outline-offset: 2px; }
  .smp .head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .smp .head b { font-weight: 600; min-width: 40px; }
  .smp progress { width: 160px; height: 6px; accent-color: var(--fg); }
  .smp table { margin: 4px 0; }
  .smp input.name { width: 80px; text-transform: uppercase; }
  .smp input.root { width: 48px; }
  .smp .bad { text-decoration: underline wavy; }
  /* CHOP (Jangada, after SLOOP 2.3): a recording into a slot, chops of any length */
  .chop canvas.wave { display: block; width: 100%; height: 150px; margin: 6px 0; border: 1px solid var(--line); cursor: default; touch-action: none; }
  .chop canvas.wave:focus { outline: 1px solid var(--fg); }
  .chop .head { margin: 3px 0; }
  .chop .sep { width: 8px; }
  .chop input.num { width: 56px; }
  .chop input[type=range] { width: 90px; accent-color: var(--fg); }
  .chop button.tap { min-width: 72px; }
  .chop .chops { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
  .chop .chip { background: none; color: var(--fg); border: 1px solid var(--line); padding: 1px 6px; }
  .chop .chip.on { background: var(--fg); color: var(--bg); }
  .chop .chip { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; user-select: none; }
  .chop .chip input { margin: 0; accent-color: var(--fg); }
  .chop .chip.off { color: var(--dim); text-decoration: line-through; }
  .chop .chip.on input { accent-color: var(--bg); }
  .chop input.len { width: 160px; }
  .chop .selrow[hidden] { display: none; }
  footer { margin-top: 24px; font-size: 11px; color: var(--dim); }
  .row.pushed .v { font-weight: 600; }
  /* librarian: local library and the device's user bank side by side, stacked on a phone */
  .libcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 8px 24px; margin-top: 6px; }
  .libcols > div { min-width: 0; }
  .libcols .bar input[type=search] { flex: 1 1 120px; min-width: 0; }
  .list { height: 260px; overflow: auto; border: 1px solid var(--line); resize: vertical; }
  .list table { width: 100%; table-layout: fixed; }
  .list th { position: sticky; top: 0; background: var(--bg); padding: 1px 6px; }
  .list td { padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list tr[data-id], .list tr[data-slot] { cursor: pointer; }
  .list tr.sel td { background: var(--fg); color: var(--bg); }
  .list tr.empty td { color: var(--dim); }
  .list tr.over td { outline: 1px dashed var(--fg); outline-offset: -1px; }
  .list.over { outline: 1px solid var(--fg); }
  .list .none { padding: 6px; color: var(--dim); }
  .list col.n { width: 40px; } .list col.e { width: 72px; } .list col.d { width: 78px; }
  .ic { font-family: "Fukiai"; font-style: normal; font-weight: 400; font-synthesis: none; line-height: 1; margin-right: .3em; }
  html:not(.fk) .ic { display: none; }
  /* wave choices: a page-drawn picker so the options can carry an icon (Chrome 135+); native menus get words only */
  @supports (appearance: base-select) {
    select.wave, select.wave::picker(select) { appearance: base-select; }
    select.wave { padding: 1px 3px; min-block-size: 0; border: 1px solid var(--line); border-radius: 0; background: var(--bg); color: var(--fg); }
    select.wave > button { font: inherit; background: none; color: inherit; padding: 0; text-align: start; }
    select.wave::picker(select) { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0; }
    select.wave option { padding: 1px 6px; min-block-size: 0; }
    select.wave option:checked { font-weight: 600; }
    select.wave option:hover, select.wave option:focus-visible { background: var(--fg); color: var(--bg); }
    select.wave option::checkmark { display: none; }
  }
  /* tabs: a wrapping row of plain buttons, the open one inverted; header stays at the top on wide screens */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 0 0; }
  @media (max-width: 600px) { .top { position: static; } }
  .tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--fg); margin: 6px 0 0; }
  .tabs button { background: none; color: var(--dim); padding: 4px 10px; border: 1px solid transparent; border-bottom: 0; white-space: nowrap; }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
  .trackbar { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button, button.tog { background: var(--bg); color: var(--fg); border: 1px solid var(--fg); padding: 1px 10px; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed="true"], button.tog[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .panel { margin: 12px 0; }
  .hint { margin: 16px 0; color: var(--dim); }
  /* sequencer: a step grid over the selected track (16 per row, 8 on a phone) */
  .grid { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; margin: 6px 0 12px; }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  .grid button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 2px; min-width: 0; height: 52px;
                 display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; text-align: left; overflow: hidden; font-size: 10px; line-height: 1.15; }
  .grid button .n { color: var(--dim); }
  .grid button .x { overflow: hidden; overflow-wrap: anywhere; flex: 1; }
  .grid button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .grid button.on .n { color: inherit; opacity: .6; }
  .grid button.acc .x { font-weight: 700; }
  .grid button.tie { border-style: dashed; border-color: var(--fg); }
  .grid button.beat { border-left-color: var(--fg); }
  #steps tr.hl td { outline: 1px solid var(--fg); }
  /* mixer: four channel strips as on the device's TRACKS page */
  .mixer { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 640px; margin: 6px 0; }
  .strip { border: 1px solid var(--line); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .strip.sel { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .strip .num { font-size: 18px; font-weight: 600; line-height: 1; }
  .strip .snd { font-size: 11px; line-height: 1.3; width: 100%; text-align: center; overflow-wrap: anywhere; min-height: 2.6em; }
  .strip .rec { font-size: 11px; color: var(--dim); }
  .strip .rec.on { color: var(--fg); font-weight: 600; }
  .strip .rec:not(.on) .ic { visibility: hidden; }
  .strip input.fader { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 150px; }
  .strip .v { font-size: 11px; white-space: nowrap; }
  .strip .pan { width: 100%; }
  .strip.muted .fader, .strip.muted .lv { opacity: .35; }
  .strip button { width: 100%; padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip button.selb:disabled { opacity: 1; background: none; color: var(--dim); }
  #sysinfo th { padding-right: 16px; }
  /* 6-OP FM (Jangada 0.5): the whole FM6 patch */
  .fm6ops { overflow-x: auto; }
  .fm6ops td, .fm6ops th { padding: 0 2px; }
  input.fm6n { width: 3.4em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <button class="lang" id="lang"></button>
  <h1>Jangada Editor</h1>
  <p class="dim"><a href="../installer/" style="color:inherit" data-t="installer"></a> · <a href="../studio/" style="color:inherit" data-t="studio"></a></p>
  <!-- always visible: connection, version, sync mode, the tabs and (Sound / Sequencer / Tracks) the track selector -->
  <header class="top">
    <div class="bar">
      <button id="connect" data-t="connect" data-ic="port_usb_c"></button>
      <span id="version" class="dim"></span>
      <span id="live" class="dim"></span>
      <span id="mock" class="dim" hidden data-t="mock"></span>
    </div>
    <div id="status"></div>
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="sound" data-t="sound" data-ic="symbol_audio"></button>
      <button role="tab" data-tab="fm6" data-t="tabFm6" data-ic="ui_knob"></button>
      <button role="tab" data-tab="sequencer" data-t="tabSeq" data-ic="symbol_grid"></button>
      <button role="tab" data-tab="tracks" data-t="tabTracks" data-ic="ui_slider_vertical"></button>
      <button role="tab" data-tab="library" data-t="library" data-ic="symbol_books"></button>
      <button role="tab" data-tab="samples" data-t="samples" data-ic="symbol_waves"></button>
      <button role="tab" data-tab="projects" data-t="projects" data-ic="symbol_folder"></button>
      <button role="tab" data-tab="settings" data-t="tabSettings" data-ic="symbol_cog"></button>
    </nav>
    <div class="trackbar" id="trackbar" hidden><span class="dim" data-t="track"></span><span class="seg" id="trackbtns" role="group"></span></div>
  </header>
  <p class="hint" id="hint" hidden></p>

  <section class="panel" id="p-sound" data-tab="sound" data-dev hidden>
    <div class="browser" id="browser">
      <label><span data-t="engine"></span><br><select id="engine"></select></label>
      <label><span data-t="presets"></span><br><select id="preset" size="8"></select></label>
      <div>
        <p class="bar"><button id="init" data-t="initSound"></button>
          <button id="factlib" data-t="factoryToLib" data-ic="symbol_folder"></button></p>
        <p class="bar"><button id="savefile" data-t="saveFile" data-ic="symbol_download"></button>
          <button id="loadfile" data-t="loadFile" data-ic="symbol_upload"></button>
          <input type="file" id="file" accept=".json,application/json" hidden></p>
      </div>
    </div>
    <p class="dim" id="drumnote" data-t="drumNote" hidden></p>
    <p class="dim" id="ctlhelp" data-t="ctlHelp"></p>
    <div class="groups" id="groups"></div>
  </section>

  <section class="panel" id="p-fm6" data-tab="fm6" data-dev hidden>
    <p class="dim" data-t="fm6Help"></p>
    <div class="group">
      <h2 data-t="fm6Source" data-ic="symbol_folder"></h2>
      <p class="bar"><label><span data-t="track"></span> <select id="fm6trk"></select></label>
        <button id="fm6read" data-t="fm6ReadBtn" data-ic="symbol_download"></button>
        <button id="fm6send" data-t="fm6SendBtn" data-ic="symbol_upload"></button>
        <label><input type="checkbox" id="fm6live"> <span data-t="fm6Live"></span></label></p>
      <p class="bar"><label><span data-t="fm6Slot"></span> <select id="fm6slot"></select></label>
        <button id="fm6load" data-t="load" data-ic="symbol_folder_open"></button>
        <button id="fm6store" data-t="fm6StoreBtn" data-ic="port_disk"></button>
        <button id="fm6erase" data-t="erase" data-ic="symbol_trash"></button></p>
      <p class="bar"><button id="fm6import" data-t="fm6Import" data-ic="symbol_upload"></button>
        <input type="file" id="fm6file" accept=".syx,.SYX,.bin,application/octet-stream" hidden>
        <button id="fm6export" data-t="fm6Export" data-ic="symbol_download"></button>
        <label id="fm6banklbl" hidden><span data-t="fm6BankSel"></span> <select id="fm6banksel"></select></label>
        <button id="fm6bankexp" data-t="fm6BankExport" data-ic="symbol_download"></button>
        <button id="fm6init" data-t="fm6Init"></button></p>
      <div id="fm6imported"></div>
    </div>
    <div class="group">
      <h2 data-t="fm6Voice" data-ic="ui_knob"></h2>
      <div id="fm6voice"></div>
    </div>
    <div class="group">
      <h2 data-t="fm6Ops" data-ic="function_env_adsr_exp"></h2>
      <div id="fm6ops"></div>
    </div>
  </section>

  <section class="panel" id="p-sequencer" data-tab="sequencer" data-dev hidden>
    <div class="groups" id="seqgroups"></div>
    <div id="steps">
      <h2 data-t="steps" data-ic="note_eight"></h2>
      <p class="bar"><button id="reloadsteps" data-t="reload" data-ic="control_arrow_loop"></button>
        <button id="clearseq" data-t="clearSeq" data-ic="symbol_trash"></button>
        <span class="dim" id="noteshelp"></span></p>
      <div class="grid" id="stepgrid"></div>
      <div class="stepcols" id="steptables"></div>
    </div>
  </section>

  <section class="panel" id="p-tracks" data-tab="tracks" data-dev hidden>
    <h2 data-t="mixer" data-ic="ui_slider_vertical"></h2>
    <div class="mixer" id="mixer"></div>
    <p class="dim" data-t="mixHelp"></p>
  </section>

  <!-- works without a device too (the device bank shows while connected) -->
  <section class="panel" id="p-library" data-tab="library" hidden>
    <div class="libcols" id="libsec">
      <div id="libpane">
        <h2 data-t="library" data-ic="symbol_books"></h2>
        <div class="bar">
          <input type="search" id="libq" spellcheck="false">
          <select id="libeng"></select>
          <select id="libtag"></select>
          <select id="libsort"></select>
        </div>
        <div class="list" id="liblist"></div>
        <p class="bar" style="margin-top:6px">
          <button id="libaud" data-t="audition" data-ic="symbol_audio"></button>
          <button id="libput" data-t="toSlot" data-ic="symbol_upload"></button>
          <button id="libren" data-t="rename"></button>
          <button id="libtags" data-t="tags"></button>
          <button id="libdup" data-t="duplicate"></button>
          <button id="libdel" data-t="delete" data-ic="symbol_trash"></button>
          <button id="libexp1" data-t="exportPatch" data-ic="symbol_download"></button>
        </p>
        <p class="bar">
          <button id="libsave" data-t="saveToLib" data-ic="port_disk"></button>
          <button id="libimport" data-t="import" data-ic="symbol_upload"></button>
          <button id="libexport" data-t="exportLib" data-ic="symbol_download"></button>
          <input type="file" id="libfile" accept=".json,application/json" multiple hidden>
          <span class="dim" id="libcount"></span>
        </p>
      </div>
      <div>
        <h2 data-t="bank" data-ic="port_disk"></h2>
        <p class="dim" id="bankhint"></p>
        <div id="bankpane" hidden>
          <div class="bar"><b id="bankhead"></b></div>
          <div class="list" id="banklist"></div>
          <p class="bar" style="margin-top:6px">
            <button id="bkload" data-t="bankLoad" data-ic="symbol_folder_open"></button>
            <button id="bkstore" data-t="bankStore" data-ic="port_disk"></button>
            <button id="bkget" data-t="bankGet" data-ic="symbol_download"></button>
            <button id="bkerase" data-t="erase" data-ic="symbol_trash"></button>
          </p>
          <p class="bar">
            <button id="bkrefresh" data-t="reload" data-ic="control_arrow_loop"></button>
            <button id="bkexport" data-t="exportBank" data-ic="symbol_download"></button>
            <span class="dim" data-t="dndHelp"></span>
          </p>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" id="p-samples" data-tab="samples" data-dev hidden>
    <h2 data-t="samples" data-ic="symbol_waves"></h2>
    <p class="dim" data-t="smpHelp"></p>
    <div class="smp chop" id="chop"></div>
    <div id="smpslots"></div>
  </section>

  <section class="panel" id="p-projects" data-tab="projects" data-dev hidden>
    <h2 data-t="projects" data-ic="symbol_folder"></h2>
    <p class="dim" data-t="projHelp"></p>
    <div class="slots" id="slots"></div>
    <div class="group" id="bkgroup" style="margin-top:16px" hidden>
      <h2 data-t="bkTitle" data-ic="port_disk"></h2>
      <p class="dim" data-t="bkHelp"></p>
      <p class="bar"><button id="bk-save" data-t="bkSave" data-ic="symbol_download"></button>
        <button id="bk-load" data-t="bkLoad" data-ic="symbol_upload"></button>
        <input id="bk-file" type="file" accept=".json,application/json" hidden></p>
      <progress id="bk-prog" max="1" value="0" hidden></progress>
    </div>
  </section>

  <section class="panel" id="p-settings" data-tab="settings" data-dev hidden>
    <div class="groups" id="setgroups"></div>
    <div class="group" style="margin-top:12px">
      <h2 data-t="system" data-ic="symbol_cog"></h2>
      <table id="sysinfo"></table>
    </div>
  </section>

  <footer>Felucca by Leo Kuroshita (@kurogedelic), <a href="https://hugelton.com" target="_blank" rel="noopener">Hügelton Instruments</a>. GPL-3.0.<br>
    <span data-t="foot"></span> M-VAVE and FM-1 are trademarks of their respective owners.<br>
    <a href="FUKIAI-LICENSE.txt" data-t="iconsCredit"></a></footer>
</main>
<script>
"use strict";
/*PROTO-BEGIN*/
/* ---------------------------------------------------------------- protocol --- */
const HDR = [0x7D, 0x46, 0x4C];
const CMD = { INFO: 1, GET: 2, SET: 3, DUMP: 4, DESC: 5, STEP_GET: 6, STEP_SET: 7, PRESET: 8, PROJECT: 9, NAMES: 10,
  SMP_BEGIN: 11, SMP_WRITE: 12, SMP_END: 13, SMP_ERASE: 14, SMP_INFO: 15,
  UP_LIST: 16, UP_GET: 17, UP_PUT: 18, UP_STORE: 19, UP_LOAD: 20, UP_ERASE: 21,
  WATCH: 22, CHANGED: 23, RELOAD: 24, PING: 25, STEP_CHANGED: 26,
  TRACK: 27, TRACK_MIX: 28, TRACK_DUMP: 29, TRACK_STEP: 30,
  TRACK_PARAM: 31, TRACK_CHANGED: 32,
  BK_LIST: 34, BK_GET: 35, BK_PUT: 36,                /* v5 (Jangada): backup / restore (fm1backup.js) */
  FM6_GET: 68, FM6_PUT: 69, FM6_LIST: 70, FM6_ERASE: 71,     /* Jangada 0.5: FM6 patches (after Felucca 1.0) */
  FM6_COMMIT: 72 };                                           /* the staged bank half to flash (INFO 46 02) */
/* frames the device sends on its own (while WATCH is on); never replies */
const PUSH = new Set([CMD.CHANGED, CMD.RELOAD, CMD.STEP_CHANGED, CMD.TRACK_CHANGED]);
/* user preset bank: name 1..12 printable ASCII, a 16-step pattern of (note, flags 1 acc 2 slide 4 tie) */
const UP = { NAME_MAX: 12, PAT: 16, LIST_MAX: 16 };
const F = { INT: 0, PCT: 1, BIPCT: 2, TIME: 3, LFOHZ: 4, CUTOFF: 5, DB: 6, SEMI: 7, ENUM: 8, BPM: 9, NOTE: 10, ONOFF: 11, OCT: 12, STEPS: 13, FILT: 14 };

const v14enc = (v) => { const u = Math.max(-8192, Math.min(8191, Math.round(v))) + 8192; return [u & 0x7F, (u >> 7) & 0x7F]; };
const v14dec = (lo, hi) => (lo | (hi << 7)) - 8192;
function strEnc(s) { const a = []; for (const c of String(s)) a.push(c.charCodeAt(0) & 0x7F); a.push(0); return a; }

/* only ever builds F0 7D 46 4C ... F7 */
function frame(cmd, args = []) {
  for (const b of args) if (!(Number.isInteger(b) && b >= 0 && b <= 0x7F)) throw new Error("bad data byte " + b);
  return [0xF0, ...HDR, cmd & 0x7F, ...args, 0xF7];
}
/* -> {cmd, a} or null when it is not an editor frame */
function unframe(d) {
  if (!d || d.length < 6 || d[0] !== 0xF0 || d[d.length - 1] !== 0xF7) return null;
  if (d[1] !== HDR[0] || d[2] !== HDR[1] || d[3] !== HDR[2]) return null;
  return { cmd: d[4], a: Array.from(d.slice(5, d.length - 1)) };
}

class Reader {
  constructor(a) { this.a = a; this.i = 0; }
  b() { if (this.i >= this.a.length) throw new Error("short reply"); return this.a[this.i++]; }
  v() { const lo = this.b(); return v14dec(lo, this.b()); }
  s() { let s = ""; for (;;) { const c = this.b(); if (!c) return s; s += String.fromCharCode(c); } }
}

const parse = {
  [CMD.INFO](a) {
    const r = new Reader(a);
    const o = { version: r.s(), nengines: r.b(), pcount: r.b(), gcount: r.b(), nstep: r.b(), pe0: r.b(), engines: [] };
    for (let i = 0; i < o.nengines; i++) o.engines.push(r.s());
    o.ntrk = r.i < a.length ? r.b() : 0;             /* v3: tracks (0 = older firmware, one instrument) */
    o.proto = r.i < a.length ? r.b() : 0;            /* v5 (Jangada): the protocol version (0 = older firmware) */
    o.fm6 = null;                                    /* Jangada 0.5: FM6 patches (cmds 68..71): 46 01 nfactory nbank;
                                                      * 46 02: with the staged bank half (PUT target 3, FM6_COMMIT);
                                                      * 46 03 (Jangada 0.6): two banks of 32, nbank 64 (B1..B64) */
    if (r.i + 3 < a.length && a[r.i] === 0x46 && a[r.i + 1] >= 1 && a[r.i + 1] <= 3)
      o.fm6 = { factory: a[r.i + 2], bank: a[r.i + 3], batch: a[r.i + 1] >= 2 };
    return o;
  },
  [CMD.GET](a) { const r = new Reader(a); return { scope: r.b(), id: r.b(), value: r.v() }; },
  [CMD.SET](a) { return parse[CMD.GET](a); },
  /* needs the counts from INFO */
  [CMD.DUMP](a, info) {
    const r = new Reader(a);
    const o = { engine: r.b(), preset: r.b(), p: [], g: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < info.gcount; i++) o.g.push(r.v());
    return o;
  },
  [CMD.DESC](a) {
    const r = new Reader(a);
    const o = { scope: r.b(), id: r.b(), fmt: r.b(), min: r.v(), max: r.v(), def: r.v(), label: r.s(), unit: r.s(), names: [] };
    if (o.fmt === F.ENUM) for (let i = 0; i <= o.max - o.min && i < 16; i++) o.names.push(r.s());
    return o;
  },
  [CMD.STEP_GET](a) {
    const r = new Reader(a);
    const o = { index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() };
    return o;
  },
  [CMD.STEP_SET](a) { return parse[CMD.STEP_GET](a); },
  [CMD.PRESET](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b() }; },
  [CMD.PROJECT](a) { const r = new Reader(a); return { op: r.b(), slot: r.b(), used: r.b() }; },
  [CMD.NAMES](a) {
    const r = new Reader(a);
    const o = { engine: r.b(), names: [] };
    const n = r.b();
    for (let i = 0; i < n; i++) o.names.push(r.s());
    o.titles = [];
    try { o.titles.push(r.s(), r.s()); } catch (e) { o.titles = []; }   /* older firmware: no page titles */
    return o;
  },
  [CMD.SMP_BEGIN](a) { const r = new Reader(a); return { slot: r.b(), rc: r.b() }; },
  [CMD.SMP_WRITE](a) { const r = new Reader(a); return { slot: r.b(), offset: r.b() | (r.b() << 7) | (r.b() << 14), rc: r.b() }; },
  [CMD.SMP_END](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.SMP_ERASE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.SMP_INFO](a) {
    const r = new Reader(a);
    const o = { nslots: r.b(), slotKiB: r.b(), slots: [] };
    for (let i = 0; i < o.nslots; i++) o.slots.push({ zones: r.b(), name: r.s(), kib: r.b() });
    return o;
  },
  [CMD.UP_LIST](a) {
    const r = new Reader(a);
    const o = { start: r.b(), count: r.b(), total: r.b(), slots: [] };
    for (let i = 0; i < o.count; i++) o.slots.push({ slot: o.start + i, used: r.b(), engine: r.b(), name: r.s() });
    return o;
  },
  /* needs P_COUNT from INFO */
  [CMD.UP_GET](a, info) {
    const r = new Reader(a);
    const o = { slot: r.b(), used: r.b(), engine: r.b(), name: r.s(), p: [], pattern: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < UP.PAT; i++) o.pattern.push([r.b(), r.b()]);
    return o;
  },
  [CMD.UP_PUT](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_STORE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_LOAD](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_ERASE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.WATCH](a) { return { on: new Reader(a).b() }; },
  [CMD.CHANGED](a) { return parse[CMD.GET](a); },
  [CMD.RELOAD](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  [CMD.PING](a) { return {}; },
  [CMD.STEP_CHANGED](a) { const r = new Reader(a); return { index: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  /* v3: tracks. engine === NENGINES: the drum track */
  [CMD.TRACK](a) {
    const r = new Reader(a);
    const o = { sel: r.b(), ntrk: r.b(), tracks: [] };
    for (let i = 0; i < o.ntrk; i++) o.tracks.push({ engine: r.b(), preset: r.b(), level: r.v(), mute: r.b(), armed: r.b() });
    return o;
  },
  [CMD.TRACK_MIX](a) { const r = new Reader(a); return { track: r.b(), level: r.v(), mute: r.b() }; },
  [CMD.TRACK_DUMP](a, info) {
    const r = new Reader(a);
    const o = { track: r.b(), engine: r.b(), preset: r.b(), p: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    return o;
  },
  [CMD.TRACK_STEP](a) {
    const r = new Reader(a);
    return { track: r.b(), index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() };
  },
  /* v4: a parameter of any track (the selection stays), and its push for a track that is not selected */
  [CMD.TRACK_PARAM](a) { const r = new Reader(a); return { track: r.b(), id: r.b(), value: r.v() }; },
  [CMD.TRACK_CHANGED](a) { return parse[CMD.TRACK_PARAM](a); },
  /* FM6 patches: target 0 a track, 1 a bank slot, 2 a factory patch; packed: the 128-byte record */
  [CMD.FM6_GET](a) { return { target: a[0], index: a[1], rc: a[2], packed: a[2] ? null : a.slice(3, 3 + 128) }; },
  [CMD.FM6_PUT](a) { return { target: a[0], index: a[1], rc: a[2] }; },
  [CMD.FM6_LIST](a) {
    const r = new Reader(a), o = { factory: r.b(), bank: r.b(), slots: [] };
    for (let i = 0; i < o.factory + o.bank; i++) o.slots.push({ used: r.b(), name: r.s() });
    return o;
  },
  [CMD.FM6_ERASE](a) { return { index: a[0], rc: a[1] }; },
  [CMD.FM6_COMMIT](a) { return { rc: a[0] }; },
};

/* a name the device accepts: printable ASCII, 1..12 characters */
function upName(s) { return String(s ?? "").replace(/[^\x20-\x7E]/g, "").trim().slice(0, UP.NAME_MAX) || "PATCH"; }

const req = {
  info: () => [CMD.INFO, []],
  get: (scope, id) => [CMD.GET, [scope, id]],
  set: (scope, id, v) => [CMD.SET, [scope, id, ...v14enc(v)]],
  dump: () => [CMD.DUMP, []],
  desc: (scope, id) => [CMD.DESC, [scope, id]],
  stepGet: (i) => [CMD.STEP_GET, [i]],
  stepSet: (i, st) => {
    const n = Math.max(0, Math.min(4, st.n | 0));
    const notes = [0, 1, 2, 3].map((k) => (st.notes[k] | 0) & 0x7F);
    return [CMD.STEP_SET, [i, n, ...notes, Math.max(0, Math.min(2, st.time | 0)), st.flags & 0x7B, (st.vel | 0) & 0x7F]];
  },
  preset: (e, p) => [CMD.PRESET, [e & 0x7F, p & 0x7F]],
  project: (op, slot) => { if (![0, 1, 2].includes(op)) throw new Error("bad PROJECT op"); return [CMD.PROJECT, [op, slot & 3]]; },   /* 0 load, 1 save, 2 query */
  names: (e) => [CMD.NAMES, [e & 0x7F]],
  smpBegin: (s) => [CMD.SMP_BEGIN, [s & 0x7F]],
  smpWrite: (s, off, bytes) => [CMD.SMP_WRITE, [s & 0x7F, off & 0x7F, (off >> 7) & 0x7F, (off >> 14) & 0x7F, ...pack7(bytes)]],
  smpEnd: (s, hdr) => [CMD.SMP_END, [s & 0x7F, ...pack7(hdr)]],
  smpErase: (s) => [CMD.SMP_ERASE, [s & 0x7F]],
  smpInfo: () => [CMD.SMP_INFO, []],
  upList: (start, count) => [CMD.UP_LIST, [start & 0x7F, Math.max(1, Math.min(UP.LIST_MAX, count | 0))]],
  upGet: (s) => [CMD.UP_GET, [s & 0x7F]],
  /* patch: {engine, name, p: P_COUNT values, pattern: 16 x [note, flags]} */
  upPut: (s, pt) => [CMD.UP_PUT, [s & 0x7F, pt.engine & 0x7F, ...strEnc(upName(pt.name)), ...pt.p.flatMap((v) => v14enc(v ?? 0)),
    ...Array.from({ length: UP.PAT }, (_, i) => { const x = (pt.pattern || [])[i] || [0, 0]; return [x[0] & 0x7F, x[1] & 7]; }).flat()]],
  upStore: (s, name) => [CMD.UP_STORE, [s & 0x7F, ...strEnc(name ? upName(name) : "")]],   /* "": the device names it ("ANALOG 07") */
  upLoad: (s) => [CMD.UP_LOAD, [s & 0x7F]],
  upErase: (s) => [CMD.UP_ERASE, [s & 0x7F]],
  /* on: 1 = pushes; 3 = also TRACK_CHANGED (v4 firmware answers 3, older firmware 1) */
  watch: (on) => [CMD.WATCH, [on === 3 ? 3 : on ? 1 : 0]],
  ping: () => [CMD.PING, []],
  /* v3: tracks 0..3 (3 = drums) */
  track: (sel) => [CMD.TRACK, sel == null ? [] : [sel & 0x7F]],
  trackMix: (tr, level, mute) => [CMD.TRACK_MIX, level == null ? [tr & 0x7F] : [tr & 0x7F, ...v14enc(level), mute ? 1 : 0]],
  trackDump: (tr) => [CMD.TRACK_DUMP, [tr & 0x7F]],
  trackStep: (tr, i, st) => [CMD.TRACK_STEP, st ? [tr & 0x7F, ...req.stepSet(i, st)[1]] : [tr & 0x7F, i & 0x7F]],
  /* v4: get (v == null) or set parameter id (P_*) of track tr, clamped as SET */
  trackParam: (tr, id, v) => [CMD.TRACK_PARAM, v == null ? [tr & 0x7F, id & 0x7F] : [tr & 0x7F, id & 0x7F, ...v14enc(v)]],
  /* FM6 patches (firmware with info.fm6) */
  fm6Get: (target, i) => [CMD.FM6_GET, [target & 0x7F, i & 0x7F]],
  fm6Put: (target, i, packed) => [CMD.FM6_PUT, [target & 0x7F, i & 0x7F, ...Array.from(packed, (x) => x & 0x7F)]],
  fm6List: () => [CMD.FM6_LIST, []],
  fm6Erase: (i) => [CMD.FM6_ERASE, [i & 0x7F]],
  fm6Commit: () => [CMD.FM6_COMMIT, []],
};

/* which reply belongs to which request (the device echoes these) */
function replyMatches(cmd, args, a) {
  switch (cmd) {
    case CMD.GET: case CMD.SET: case CMD.DESC: return a[0] === args[0] && a[1] === args[1];
    case CMD.STEP_GET: case CMD.STEP_SET: case CMD.NAMES:
    case CMD.SMP_BEGIN: case CMD.SMP_END: case CMD.SMP_ERASE: return a[0] === args[0];
    case CMD.SMP_WRITE: return a[0] === args[0] && a[1] === args[1] && a[2] === args[2] && a[3] === args[3];
    case CMD.PROJECT: return a[0] === args[0] && a[1] === args[1];
    case CMD.UP_LIST: case CMD.UP_GET: case CMD.UP_PUT: case CMD.UP_STORE: case CMD.UP_LOAD: case CMD.UP_ERASE:
    case CMD.TRACK_MIX: case CMD.TRACK_DUMP: return a[0] === args[0];
    case CMD.WATCH: return (a[0] & 1) === (args[0] & 1);   /* bit 1: v4 firmware only */
    case CMD.TRACK_STEP: case CMD.TRACK_PARAM: return a[0] === args[0] && a[1] === args[1];
    case CMD.BK_GET: return a[0] === args[0] && [0, 1, 2, 3, 4].every((k) => a[2 + k] === args[1 + k]);
    case CMD.BK_PUT: return a[0] === args[0] && a[1] === args[1];
    case CMD.FM6_GET: case CMD.FM6_PUT: return a[0] === args[0] && a[1] === args[1];
    case CMD.FM6_ERASE: return a[0] === args[0];
    default: return true;
  }
}

/* strict request/response: one frame in flight, the rest queued. Push frames (CHANGED, RELOAD,
   STEP_CHANGED) can come at any time, also between a request and its reply: they go to onPush. */
class Link {
  constructor(send, opts = {}) {
    this.sendRaw = send;
    this.q = [];
    this.cur = null;
    this.closed = false;
    this.lastSent = 0;                              /* Date.now() of the last frame sent (WATCH keep-alive) */
    this.timeout = opts.timeout || 300;
    this.onUnknown = opts.onUnknown || (() => {});
    this.onTimeout = opts.onTimeout || (() => {});
    this.onPush = opts.onPush || (() => {});
    this.onGap = opts.onGap || (() => {});         /* (ms) nothing was sent for that long (WATCH may have ended) */
  }
  get idle() { return !this.cur && !this.q.length; }
  hasQueued(key) { return this.q.some((r) => r.key === key); }
  /* r = [cmd, args]; opt: {timeout, retries, key (coalesce queued requests: the latest args win), front,
     quiet (a timeout is expected: no onTimeout)} */
  request(r, opt = {}) {
    if (this.closed) return Promise.reject(new Error("closed"));
    const [cmd, args] = r;
    if (opt.key) {
      const old = this.q.find((x) => x.key === opt.key);
      if (old) { old.cmd = cmd; old.args = args; return old.promise; }
    }
    let res, rej;
    const promise = new Promise((a, b) => { res = a; rej = b; });
    const item = { cmd, args, key: opt.key, res, rej, promise, quiet: !!opt.quiet,
      timeout: opt.timeout || this.timeout, retries: opt.retries ?? 1 };
    if (opt.front) this.q.unshift(item); else this.q.push(item);
    this.pump();
    return promise;
  }
  pump() {
    if (this.cur || this.closed || !this.q.length) return;
    this.cur = this.q.shift();
    this.fire();
  }
  fire() {
    const c = this.cur;
    const now = Date.now();
    if (this.lastSent && now - this.lastSent > 2500) this.onGap(now - this.lastSent);
    this.lastSent = now;
    try { this.sendRaw(frame(c.cmd, c.args)); } catch (e) { this.finish(null, e); return; }
    c.timer = setTimeout(() => {
      if (this.cur !== c) return;
      if (c.retries-- > 0) { this.fire(); return; }
      if (!c.quiet) this.onTimeout(c.cmd);
      this.finish(null, new Error("timeout (cmd " + c.cmd + ")"));
    }, c.timeout);
  }
  finish(val, err) {
    const c = this.cur;
    if (!c) return;
    clearTimeout(c.timer);
    this.cur = null;
    if (err) c.rej(err); else c.res(val);
    this.pump();
  }
  /* raw incoming MIDI bytes */
  receive(data) {
    const f = unframe(data);
    if (!f) return;                                  /* not ours (notes, clock, other SysEx) */
    if (PUSH.has(f.cmd)) { this.onPush(f); return; }
    const c = this.cur;
    if (!c || f.cmd !== c.cmd || !replyMatches(c.cmd, c.args, f.a)) { this.onUnknown(f); return; }
    this.finish(f.a);
  }
  close() {
    this.closed = true;
    const all = (this.cur ? [this.cur] : []).concat(this.q);
    if (this.cur) clearTimeout(this.cur.timer);
    this.cur = null;
    this.q = [];
    for (const r of all) r.rej(new Error("closed"));
  }
}

/* ------------------------------------------------------------------- FM6 --- */
/* The FM6 engine's patches (eng_fm6.c, EDITOR_PROTOCOL.md "FM6 patches"; after Felucca 1.0's editor): the generic
   6-operator voice. voice: 155 bytes, 6 x 21 operator bytes (the sixth operator first, as the format has them), then
   19 voice bytes and a 10-character name. packed: the 128-byte record of a 32-voice bank (every byte 7-bit). SysEx
   files: a single voice (F0 43 0n 00 01 1B, 155 bytes, checksum, F7: 163 bytes) or 32 packed voices (F0 43 0n 09 20
   00, 4096 bytes, checksum, F7: 4104 bytes); raw 155 / 4096-byte files are read too. */
const FM6 = (() => {
  /* per operator byte: name, highest value; then the voice bytes */
  const OP = [["R1", 99], ["R2", 99], ["R3", 99], ["R4", 99], ["L1", 99], ["L2", 99], ["L3", 99], ["L4", 99],
    ["BP", 99], ["LD", 99], ["RD", 99], ["LC", 3], ["RC", 3], ["RS", 7], ["AMS", 3], ["KVS", 7], ["OL", 99],
    ["MODE", 1], ["FC", 31], ["FF", 99], ["DET", 14]];
  const VOICE = [["PR1", 99], ["PR2", 99], ["PR3", 99], ["PR4", 99], ["PL1", 99], ["PL2", 99], ["PL3", 99], ["PL4", 99],
    ["ALG", 31], ["FB", 7], ["OKS", 1], ["LFS", 99], ["LFD", 99], ["LPMD", 99], ["LAMD", 99], ["LKS", 1], ["LFW", 5],
    ["LPMS", 7], ["TRNSP", 48]];
  const OPI = Object.fromEntries(OP.map(([n], i) => [n, i])), VI = Object.fromEntries(VOICE.map(([n], i) => [n, 126 + i]));
  const NAME = 145, SIZE = 155, PACKED = 128, BANK = 32;
  const max = (i) => (i < 126 ? OP[i % 21][1] : i < NAME ? VOICE[i - 126][1] : 126);
  /* byte i of operator n (1..6) */
  const at = (n, field) => (6 - n) * 21 + OPI[field];
  function sanitize(v) {                          /* eng_fm6.c fm6_sanitize */
    const o = Uint8Array.from(Array.from(v).slice(0, SIZE));
    for (let i = 0; i < SIZE; i++) o[i] = i >= NAME ? (o[i] < 32 || o[i] > 126 ? 32 : o[i]) : Math.min(o[i], max(i));
    return o;
  }
  function unpack(b) {                            /* eng_fm6.c fm6_unpack */
    const v = new Uint8Array(SIZE);
    for (let k = 0; k < 6; k++) {
      const o = k * 17, d = k * 21;
      for (let i = 0; i < 11; i++) v[d + i] = b[o + i] & 127;
      v[d + 11] = b[o + 11] & 3; v[d + 12] = b[o + 11] >> 2 & 3; v[d + 13] = b[o + 12] & 7; v[d + 20] = b[o + 12] >> 3 & 15;
      v[d + 14] = b[o + 13] & 3; v[d + 15] = b[o + 13] >> 2 & 7; v[d + 16] = b[o + 14] & 127; v[d + 17] = b[o + 15] & 1;
      v[d + 18] = b[o + 15] >> 1 & 31; v[d + 19] = b[o + 16] & 127;
    }
    for (let i = 0; i < 9; i++) v[126 + i] = b[102 + i] & 127;
    v[134] &= 31; v[135] = b[111] & 7; v[136] = b[111] >> 3 & 1;
    for (let i = 0; i < 4; i++) v[137 + i] = b[112 + i] & 127;
    v[141] = b[116] & 1; v[142] = b[116] >> 1 & 7; v[143] = b[116] >> 4 & 7; v[144] = b[117] & 127;
    for (let i = 0; i < 10; i++) v[NAME + i] = b[118 + i] & 127;
    return sanitize(v);
  }
  function pack(v) {                              /* eng_fm6.c fm6_pack */
    const b = new Array(PACKED).fill(0);
    for (let k = 0; k < 6; k++) {
      const o = k * 17, d = k * 21;
      for (let i = 0; i < 11; i++) b[o + i] = v[d + i] & 127;
      b[o + 11] = (v[d + 11] & 3) | (v[d + 12] & 3) << 2; b[o + 12] = (v[d + 13] & 7) | (v[d + 20] & 15) << 3;
      b[o + 13] = (v[d + 14] & 3) | (v[d + 15] & 7) << 2; b[o + 14] = v[d + 16] & 127;
      b[o + 15] = (v[d + 17] & 1) | (v[d + 18] & 31) << 1; b[o + 16] = v[d + 19] & 127;
    }
    for (let i = 0; i < 9; i++) b[102 + i] = v[126 + i] & 127;
    b[110] &= 31; b[111] = (v[135] & 7) | (v[136] & 1) << 3;
    for (let i = 0; i < 4; i++) b[112 + i] = v[137 + i] & 127;
    b[116] = (v[141] & 1) | (v[142] & 7) << 1 | (v[143] & 7) << 4; b[117] = v[144] & 127;
    for (let i = 0; i < 10; i++) b[118 + i] = v[NAME + i] & 127;
    return b;
  }

/* onset novelty per frame: the rise of the log energy of the signal's first difference (the attack

/* hits: sens 1 (only the hardest and loudest) .. 10 (every small one); at least 60 ms apart. A hit is a

    if (L && Math.max(L[f], L[Math.min(L.length - 1, f + 1)], L[Math.min(L.length - 1, f + 2)]) < gate) continue;
    if (f - last < gap) {

/* a tap at pos (as heard) moved to the hit it meant: the strongest attack within +-win s, if any */

/* -------------------------------------------------------------- librarian --- */
/* A patch (library entry, user preset):
     {name, engine (index), engineName, p: [P_COUNT values by parameter id, null = unknown],
      pattern: 16 x [note 0..127 (0 rest), flags 1 accent | 2 slide | 4 tie] or null, tags: [], created, modified}

     {
       "format": "felucca-library", "version": 1,
       "kind": "library" | "bank" | "patch",
       "firmware": "FELUCCA 0.5 ...",          device version string when exported ("" if unknown)
       "pCount": 57, "pE0": 49,                 P_COUNT and the first engine parameter id
       "paramLabels": ["LVL", "ATK", ...],      one key per parameter id: the DESC label, "#2", "#3" appended to
                                                a repeated label (PIT, PIT#2), and "E0".."E7" for the engine
                                                parameters (their labels depend on the engine)
       "engines": ["ANALOG", ...],              engine names by index
       "exported": "2026-10-03T12:00:00.000Z",
       "patches": [{ "name", "engine", "engineName", "params": [pCount numbers or null],
                     "pattern": [[note, flags] x 16] or null, "tags": [...], "created", "modified",
                     "slot": n (bank files only, 0-based) }]
     }
   Reading maps every parameter by its key, so a firmware with other ids (or more parameters) still gets
   the right values; parameters the file does not have are null (left at the engine default). Engines are
   matched by name. The old single-sound file ("felucca-patch" version 1, "Save to file") is read too. */

    const l = (pdesc[i] && pdesc[i].label) || "P" + i;

  async get(rq, info, slot) { return parse[CMD.UP_GET](await rq(req.upGet(slot)), info); },
  /* -> rc (0 ok) */
  async put(rq, slot, pt) { return parse[CMD.UP_PUT](await rq(req.upPut(slot, pt), FLASH_OPT)).rc; },
  async store(rq, slot, name) { return parse[CMD.UP_STORE](await rq(req.upStore(slot, name), FLASH_OPT)).rc; },
  async load(rq, slot) { return parse[CMD.UP_LOAD](await rq(req.upLoad(slot), { timeout: 1000 })).rc; },
  async erase(rq, slot) { return parse[CMD.UP_ERASE](await rq(req.upErase(slot), FLASH_OPT)).rc; },
};

/* the current sound: DUMP + the first 16 steps */
async function capturePatch(rq, info, name) {
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const steps = [];
  for (let i = 0; i < UP.PAT && i < info.nstep; i++) steps.push(parse[CMD.STEP_GET](await rq(req.stepGet(i))));
  return { patch: cleanPatch({ name, engine: dump.engine, engineName: info.engines[dump.engine], p: dump.p, pattern: patternFromSteps(steps) }), dump, steps };
}

/* play a patch without writing flash: SET the engine (G_ENGSEL, engine defaults), SET every instrument
   parameter that differs, and the pattern into steps 1..16 only when the sequencer is empty.
   opt: {gEng: G_ENGSEL id, slen: the LEN parameter id, steps: the device's steps if known (else read), progress(i, n)} */
async function auditionPatch(rq, info, pt, opt = {}) {
  /* is the sequencer empty? (before G_ENGSEL: that applies the engine's first preset, pattern included) */
  let steps = opt.steps;
  if (!steps || steps.length < info.nstep) {
    steps = [];
    for (let i = 0; i < info.nstep; i++) steps.push(parse[CMD.STEP_GET](await rq(req.stepGet(i))));
  }
  const empty = steps.every((s) => !s || !s.n);
  await rq(req.set(1, opt.gEng ?? 20, pt.engine));
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const n = Math.min(info.pcount, pt.p.length);
  for (let i = 0; i < n; i++) {
    const v = pt.p[i];
    if (opt.progress) opt.progress(i, n);
    if (v == null || v === dump.p[i]) continue;
    await rq(req.set(0, i, v));
  }
  /* an empty sequencer gets the patch's pattern, or stays empty (no pattern of that first preset) */
  const wrote = empty && patternUsed(pt.pattern);
  if (empty) {
    const ps = stepsFromPattern(pt.pattern);
    for (let i = 0; i < UP.PAT && i < info.nstep; i++) await rq(req.stepSet(i, ps[i]));
    if (wrote && opt.slen != null) await rq(req.set(0, opt.slen, Math.max(1, Math.min(16, pt.p[opt.slen] ?? 16))));   /* as UP_LOAD */
  }
  return { wrote };
}

/* WATCH on (asking for TRACK_CHANGED too): false when the firmware does not know it (older than protocol v2),
   else 1, or 3 when it also has TRACK_PARAM / TRACK_CHANGED (protocol v4) */
async function startWatch(rq) {
  try { const on = parse[CMD.WATCH](await rq(req.watch(3), { timeout: 300, retries: 1, quiet: true })).on; return on & 1 ? on & 3 : false; }
  catch (e) { if (e.message === "closed") throw e; return false; }
}

/* ------------------------------------------------------------ mixer (v3) --- */
/* The TRACKS page in the editor: TRACK (engine, preset, level, mute, armed of all four) and TRACK_DUMP
   of each track for its P_PAN. Level and mute go through TRACK_MIX (any track; the drum level is
   G_DRLVL). Pan: TRACK_PARAM (v4, any track); with v3 firmware a plain SET, which reaches only the
   selected track: another track is selected for it and the selection is put back (TRACK pushes no
   RELOAD). ids: {pan: P_PAN id} */
const mixer = {
  async read(rq, info, ids) {
    const tr = parse[CMD.TRACK](await rq(req.track()));
    for (let i = 0; i < tr.ntrk; i++) {
      const d = parse[CMD.TRACK_DUMP](await rq(req.trackDump(i)), info);
      tr.tracks[i].pan = ids.pan == null ? null : d.p[ids.pan];
    }
    return tr;
  },
  /* -> {track, level, mute} as the device has them now */
  async setMix(rq, track, level, mute, opt) { return parse[CMD.TRACK_MIX](await rq(req.trackMix(track, level, mute), opt)); },
  /* -> the pan value after clamping. v4: TRACK_PARAM, the selection stays */
  async setPan(rq, track, sel, panId, v, v4) {
    if (v4) return parse[CMD.TRACK_PARAM](await rq(req.trackParam(track, panId, v), { key: "pan:" + track })).value;
    if (track === sel) return parse[CMD.SET](await rq(req.set(0, panId, v))).value;
    await rq(req.track(track));
    try { return parse[CMD.SET](await rq(req.set(0, panId, v))).value; }
    finally { await rq(req.track(sel)).catch(() => {}); }
  },
};

/* ---------------------------------------------------------------- tabs --- */
/* one panel at a time; the last one is remembered (localStorage) and in the URL hash (#sound ...) */
const TABS = ["sound", "fm6", "sequencer", "tracks", "library", "samples", "projects", "settings"];
const TAB_KEY = "felucca-editor-tab";
const TRACK_TABS = new Set(["sound", "sequencer", "tracks"]);
let tab = (() => {
  const h = location.hash.slice(1);
  if (TABS.includes(h)) return h;
  try { const v = localStorage.getItem(TAB_KEY); if (TABS.includes(v)) return v; } catch (e) { /* no storage */ }
  return "sound";
})();
const hasTracks = () => !!dev && !!dev.info && !!dev.info.ntrk;
function showTab(name) {
  if (!TABS.includes(name)) name = "sound";
  const prev = tab;
  tab = name;
  try { localStorage.setItem(TAB_KEY, name); } catch (e) { /* no storage */ }
  if (location.hash !== "#" + name) history.replaceState(null, "", location.pathname + location.search + "#" + name);
  renderPanels();
  if (name === "tracks" && prev !== "tracks" && hasTracks() && dev.dump) op(readMixer);
  if (name === "fm6" && prev !== "fm6" && dev && dev.dump && dev.info.fm6) op(fm6Enter);
}
function renderPanels() {
  /* the Tracks tab only with a four-track firmware */
  const tracksOk = !dev || hasTracks() || !dev.info;
  const fm6Off = !!dev && !!dev.info && !dev.info.fm6;              /* the 6-OP FM tab: firmware with FM6 patches */
  const want = (tab === "tracks" && dev && dev.info && !hasTracks()) || (tab === "fm6" && fm6Off) ? "sound" : tab;
  for (const b of $("tabs").querySelectorAll("button[data-tab]")) {
    const on = b.dataset.tab === want;
    b.setAttribute("aria-selected", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
    if (b.dataset.tab === "tracks") b.hidden = !tracksOk;
    if (b.dataset.tab === "fm6") b.hidden = fm6Off;
  }
  const ready = !!dev && !!dev.dump;
  let hint = "";
  for (const p of document.querySelectorAll(".panel")) {
    const mine = p.dataset.tab === want;
    let show = mine && (!("dev" in p.dataset) || ready);
    if (mine && "dev" in p.dataset && !dev) hint = "needDevice";   /* (while connecting the status line says it) */
    if (show && want === "samples" && !dev.smp) { show = false; hint = "smpNone"; }
    p.hidden = !show;
  }
  $("hint").hidden = !hint;
  if (hint) $("hint").textContent = t(hint);
  $("trackbar").hidden = !(ready && hasTracks() && TRACK_TABS.has(want));
}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
$("tabs").addEventListener("keydown", (e) => {          /* arrow keys move between the tabs */
  const dir = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!dir) return;
  const bs = [...$("tabs").querySelectorAll("button[data-tab]:not([hidden])")];
  const i = bs.findIndex((b) => b.getAttribute("aria-selected") === "true");
  const n = bs[(i + dir + bs.length) % bs.length];
  e.preventDefault();
  showTab(n.dataset.tab);
  n.focus();
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) showTab(h); });

/* -------------------------------------------------------------- MIDI --- */
async function connect() {
  wantConnected = true;
  if (!MOCK && !navigator.requestMIDIAccess) { sayK("nomidi"); return; }
  $("connect").disabled = true;
  sayK("connecting");
  try {
    if (!access) {
      if (MOCK) { mock = makeMockDevice({ legacy: QS.get("legacy") === "1" }); access = mock.access; }
      else {
        try { access = await navigator.requestMIDIAccess({ sysex: true }); }
        catch (e) { sayK("denied"); return; }
      }
      access.onstatechange = onState;
    }
    const isF = (p) => /jangada|felucca/i.test(p.name || "") && p.state !== "disconnected";
    const input = [...access.inputs.values()].find(isF);
    const output = [...access.outputs.values()].find(isF);
    if (!input || !output) { sayK("nodevice"); return; }
    const link = new Link((d) => output.send(d), {
      timeout: 300,
      onUnknown: (f) => console.debug("ignored reply", f),
      onTimeout: () => sayK("noreply"),
      onPush: (f) => onPush(f),
      onGap: () => { rewatch = true; },
    });
    input.onmidimessage = (e) => link.receive(e.data);
    if (input.open) await input.open().catch(() => {});
    dev = { link, input, output, info: null, pdesc: [], gdesc: [], names: [], dump: null, steps: [], slotUsed: [null, null, null, null],
      keys: null, watch: false, bank: null };
    setLabel($("connect"), t("disconnect"));
    await load(dev);
  } catch (e) {
    console.error(e);
    if (dev) {                                       /* not unplugged meanwhile (that says "lost") */
      const timeout = /^timeout/.test(e.message);
      disconnect();
      sayK(timeout ? "noreply" : "error", timeout ? "" : e.message);
    }
  } finally {
    $("connect").disabled = false;
  }
}

function disconnect(reasonKey = "disconnected") {
  if (dev) {
    dev.link.close();
    dev.input.onmidimessage = null;
  }
  dev = null;
  busy = 0;
  needReload = false;
  fm6List = null;
  fm6Seen = false;
  renderPanels();
  renderMixer();
  renderSysinfo();
  renderLive();
  renderLib();
  renderBank();
  $("version").textContent = "";
  setLabel($("connect"), t("connect"));
  sayK(reasonKey);
}

function onState(e) {
  const p = e.port;
  if (!p || !/jangada|felucca/i.test(p.name || "")) return;
  if (dev && p.state === "disconnected" && (p.id === dev.input.id || p.id === dev.output.id)) {
    disconnect("lost");
  } else if (!dev && wantConnected && p.state === "connected" && p.type === "output") {
    clearTimeout(onState.tm);                       /* the device came back: reconnect */
    onState.tm = setTimeout(() => { if (!dev && wantConnected) connect(); }, 800);
  }
}

const rq = (r, opt) => dev.link.request(r, opt);
async function getDesc(scope, id) { return parse[CMD.DESC](await rq(req.desc(scope, id))); }
async function getDump() { lastDump = Date.now(); return parse[CMD.DUMP](await rq(req.dump()), dev.info); }
async function getStep(i) { return parse[CMD.STEP_GET](await rq(req.stepGet(i))); }

/* the whole connect sequence */
async function load(d) {
  busy++;
  try {
    /* the first frame after opening the port can be lost: a few tries */
    d.info = parse[CMD.INFO](await d.link.request(req.info(), { timeout: 500, retries: 3 }));
    $("version").textContent = d.info.version;
    const total = d.info.pcount + d.info.gcount;
    for (let i = 0; i < d.info.pcount; i++) { sayK("reading", `${i + 1}/${total}`); d.pdesc[i] = await getDescOrNull(0, i); }
    for (let i = 0; i < d.info.gcount; i++) { sayK("reading", `${d.info.pcount + i + 1}/${total}`); d.gdesc[i] = await getDescOrNull(1, i); }
    d.titles = [];

      try { d.slotUsed[k] = parse[CMD.PROJECT](await d.link.request(req.project(2, k))).used; }

    try { d.smp = parse[CMD.SMP_INFO](await d.link.request(req.smpInfo())); }
    catch (e) { if (e.message === "closed") throw e; d.smp = null; }   /* older firmware, or no flash */

    await libAdopt(d);
    if (d.info.ntrk) d.sel = parse[CMD.TRACK](await d.link.request(req.track())).sel;   /* v3: the selected track */
    d.dump = await getDump();
    buildUI();
    renderPanels();
    await loadSteps();
    if (d.info.ntrk) await readMixer();
    /* protocol v2: live pushes and the user bank; older firmware: DUMP polling, no bank */
    const rqd = (r, o) => d.link.request(r, o);
    d.watch = await startWatch(rqd);
    d.v4 = d.watch === 3;                           /* TRACK_PARAM / TRACK_CHANGED */

function paramRow(s, id) {
  const d = s ? dev.gdesc[id] : dev.pdesc[id];

  const k = key(s, id);
  let input;
  if (d.fmt === F.ENUM || d.fmt === F.NOTE || d.fmt === F.ONOFF) {
    const wave = RICH_SELECT && d.fmt === F.ENUM && /^WAVE2?$/.test(d.label);
    input = el("select", { class: wave ? "wave" : null });
    /* the closed select shows a copy of the chosen option (icon span included), not its bare text */
    if (wave) input.append(el("button", {}, el("selectedcontent")));
    for (let v = d.min; v <= d.max; v++) {
      const [txt] = fmtValue(d, v);
      const name = d.fmt === F.ENUM && d.names[v - d.min] == null ? String(v) : txt;
      input.append(el("option", { value: v, ic: wave && WAVE_IC[name] }, name));

    input.addEventListener("change", () => userSet(s, id, +input.value, true));
    input.addEventListener("dblclick", () => { input.value = d.def; userSet(s, id, d.def, true); });

      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];

  ctl.set(k, { input, out, desc: d, scope: s, id, row });
  showValue(k, s ? dev.dump.g[id] : dev.dump.p[id], true);

function showValue(k, v, force) {

  const out = [];
  z.forEach((x, j) => {
    out[x.i] = [j === 0 ? 0 : Math.floor((z[j - 1].root + x.root) / 2) + 1, j === z.length - 1 ? 127 : Math.floor((x.root + z[j + 1].root) / 2)];
  });
  files.forEach((f, i) => { if (f.lo != null) out[i] = [f.lo, f.hi]; });   /* (chops: their own keys) */
  return out;

    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ab = await new Ctx(1, 1, SMP.RATE).decodeAudioData(buf.slice(0));
    x = new Float64Array(ab.length);
    for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let i = 0; i < d.length; i++) x[i] += d[i] / ab.numberOfChannels; }
  }
  if (!x.length) throw new Error("no audio");
  return { fname: f.name, s: normalize(x), root: rootFromName(f.name.replace(/\.[^.]*$/, "")) };
}

async function addFiles(k, list) {
  const d = smpDraft[k];
  for (const f of list) {
    try {
      const z = await decodeFile(f);
      if (d.files.length >= SMP.MAX_ZONES) break;
      d.files.push(z);
      if (!d.name) d.name = f.name.replace(/\.[^.]*$/, "").toUpperCase().replace(/[^\x20-\x7E]/g, "").slice(0, 8);
    } catch (e) { sayK("smpDecodeFail", `${f.name} (${e.message})`); }
  }
  renderSamples();
}

function renderSamples() {
  chopUI();                                         /* (once; then its send buttons follow the device) */
  chopRender();
  const box = $("smpslots");                        /* the tab says when there are no slots (renderPanels) */
  if (!dev || !dev.smp) { box.replaceChildren(); return; }
  const max = SMP.MAX_DATA;
  box.replaceChildren(...dev.smp.slots.map((u, k) => {
    const d = smpDraft[k];
    const status = u.zones ? `${u.name || "—"}, ${u.zones} ${t("zones")}, ${u.kib} KiB` : t("empty");
    const bar = el("progress", { max: dev.smp.slotKiB, value: u.kib, title: `${u.kib} / ${dev.smp.slotKiB} KiB` });
    const file = el("input", { type: "file", accept: ".wav,audio/wav,audio/x-wav,audio/*", multiple: true, hidden: true });
    file.addEventListener("change", () => { addFiles(k, [...file.files]); file.value = ""; });
    const name = el("input", { type: "text", class: "name", maxlength: 8, value: d.name, spellcheck: "false", placeholder: "NAME" });
    name.addEventListener("input", () => {
      const v = name.value.toUpperCase().replace(/[^\x20-\x7E]/g, "").slice(0, 8);
      if (v !== name.value) name.value = v;
      d.name = v;
    });
    const bytes = draftBytes(d), tooBig = bytes > max;
    const size = el("span", { class: tooBig ? "bad" : "dim",
      text: d.files.length ? `${kib(bytes)} / ${kib(max)} KiB` + (tooBig ? " " + t("smpTooBig") : "") : "" });
    const prog = el("progress", { max: 1, value: 0, hidden: true });
    const blk = el("div", { class: "smp", "data-k": k },
      el("div", { class: "head" }, el("b", { text: `USR${k + 1}` }), el("span", { text: status }), bar,
        el("button", { ic: "symbol_trash", disabled: smpBusy || !u.zones, onclick: () => smpErase(k) }, t("erase"))),
      el("div", { class: "head" }, el("span", { text: t("smpName") }), name,
        el("button", { ic: "symbol_folder_open", disabled: smpBusy, onclick: () => file.click() }, t("chooseFiles")), file,
        el("button", { ic: "symbol_upload", disabled: smpBusy || !d.files.length || tooBig || !d.name, onclick: () => smpUpload(k, prog) }, t("upload")),
        d.files.length ? el("button", { text: t("clearList"), disabled: smpBusy, onclick: () => { d.files = []; renderSamples(); } }) : "",
        size, prog));
    if (d.files.length) {
      const keys = splitKeys(d.files);
      const tb = el("table", {}, el("tr", {}, el("th", { text: t("file") }), el("th", { text: t("root") }),
        el("th", { text: t("keys") }), el("th", { text: t("length") }), el("th")));
      d.files.forEach((f, i) => {
        const root = el("input", { type: "text", class: "root", value: noteName(f.root), spellcheck: "false" });
        root.addEventListener("change", () => {
          const n = parseNote(root.value.trim());
          if (n == null) { root.classList.add("bad"); return; }
          f.root = n;
          renderSamples();
        });
        tb.append(el("tr", {}, el("td", { text: f.fname }), el("td", {}, root),
          el("td", { text: `${noteName(keys[i][0])}–${noteName(keys[i][1])}` }),
          el("td", { text: `${(f.s.length / SMP.RATE).toFixed(2)} s` }),
          el("td", {}, el("button", { text: t("remove"), disabled: smpBusy, onclick: () => { d.files.splice(i, 1); renderSamples(); } }))));
      });
      blk.append(tb);
    }
    blk.addEventListener("dragover", (e) => { e.preventDefault(); blk.classList.add("over"); });
    blk.addEventListener("dragleave", () => blk.classList.remove("over"));
    blk.addEventListener("drop", (e) => {
      e.preventDefault();
      blk.classList.remove("over");
      if (!smpBusy && e.dataTransfer.files.length) addFiles(k, [...e.dataTransfer.files]);
    });
    return blk;
  }));
}

async function smpInfo() { dev.smp = parse[CMD.SMP_INFO](await rq(req.smpInfo())); }

async function smpUpload(k, prog, ask = true) {
  const d = smpDraft[k];
  let built, done = false;
  try { built = buildSlot(d.name, d.files.map((f) => ({ s: f.s, root: f.root, lo: f.lo, hi: f.hi }))); }
  catch (e) { sayK("smpFail", e.message); return false; }
  if (ask && !confirm(t("confirmUpload").replace("{n}", k + 1))) return false;
  const { hdr, data } = built;
  busy++;
  smpBusy = true;
  renderSamples();
  prog = $("smpslots").querySelector(`[data-k="${k}"] progress[max="1"]`);
  prog.hidden = false;
  try {
    const t0 = performance.now();
    let r = parse[CMD.SMP_BEGIN](await rq(req.smpBegin(k), { timeout: 1000, retries: 0 }));
    if (r.rc) throw new Error("begin rc " + r.rc);
    for (let off = 0; off < data.length; off += 256) {
      const a = SMP.DATA_OFF + off;
      const w = parse[CMD.SMP_WRITE](await rq(req.smpWrite(k, a, data.subarray(off, off + 256)), { timeout: 1000, retries: 1 }));
      if (w.rc) throw new Error(`write at 0x${a.toString(16)} rc ${w.rc}`);
      prog.value = (off + 256) / data.length;
      sayK("smpUploading", `${k + 1}  ${kib(Math.min(data.length, off + 256))} / ${kib(data.length)} KiB`);
    }
    r = parse[CMD.SMP_END](await rq(req.smpEnd(k, hdr), { timeout: 2000, retries: 0 }));
    if (r.rc) throw new Error(`end rc ${r.rc} (${SMP_RC[r.rc] || "?"})`);
    sayK("smpDone", `${k + 1}  ${((performance.now() - t0) / 1000).toFixed(1)} s`);
    done = true;
  } catch (e) {
    if (e.message !== "closed") sayK("smpFail", e.message);
  } finally {
    try { if (dev) await smpInfo(); } catch (e) { /* shown by the next action */ }
    smpBusy = false;
    busy--;
    renderSamples();
  }
  return done;
}

async function smpErase(k) {
  if (!dev || !confirm(t("confirmErase").replace("{n}", k + 1))) return;
  busy++;
  smpBusy = true;
  renderSamples();
  try {
    const r = parse[CMD.SMP_ERASE](await rq(req.smpErase(k), { timeout: 2500, retries: 0 }));
    if (r.rc) throw new Error("erase rc " + r.rc);
    sayK("smpErased", String(k + 1));
  } catch (e) {
    if (e.message !== "closed") sayK("smpFail", e.message);
  } finally {
    try { if (dev) await smpInfo(); } catch (e) { /* ignore */ }
    smpBusy = false;
    busy--;
    renderSamples();
  }
}

/* ---------------------------------------------------------------- CHOP --- */
/* Jangada, after SLOOP 2.2 / 2.3. Load a recording, mark the chops (live: TAP / space while it plays, each tap moved to the hit it
   meant; or by hits, a tempo grid, equal parts; double-click adds, drag moves, Delete removes),
   audition them (click, keys 1-9 0), keep or leave out each one and set its length (a recording longer
   than a slot: keep the chops you want, shorten them, or Fit to slot), then one chop per key into
   USR1..3 or as WAV files. CH.opt[i] = {off, len} goes with marker i. */
const CH = { x: null, nov: null, name: "", marks: [], opt: [], sel: -1, v0: 0, v1: 1, ctx: null, src: null, t0: 0, raf: 0,
  drag: -1, dragEnd: false, key0: 60, mode: 0, maxLen: 0, ui: null };
const chR = () => SMP.RATE;
const chSecs = (n) => (n / SMP.RATE).toFixed(2) + " s";

function chopChops() { return CH.x ? chopList(CH.marks, CH.x.length, Math.round(CH.maxLen * SMP.RATE), CH.opt) : []; }
function chopUsed() {                                /* the chops the slot gets, their samples, and each chop's key */
  const c = chopChops(), use = chopPick(c, CH.mode, Math.max(0, CH.sel)), key = new Map();
  if (CH.mode === 0) use.forEach((q, j) => key.set(q.i, Math.min(127, CH.key0 + j)));
  return { all: c, use, n: use.reduce((a, q) => a + (q.end - q.start), 0), key };
}
/* the label of chop i: its key, "—" when left out, nothing past the 16 kept ones or over the whole keyboard */
function chopKeyName(u, i) {
  if (CH.mode === 1) return "";
  const c = u.all[i];
  return c && c.off ? " —" : u.key.has(i) ? " " + noteName(u.key.get(i)) : "";
}
function chopOpt(i) { return CH.opt[i] || (CH.opt[i] = { off: false, len: 0 }); }
function chopKeep(i, keep) {                         /* keep / leave out chop i (keep undefined: toggle) */
  if (!CH.x || i < 0 || i >= CH.marks.length) return;
  const o = chopOpt(i);
  o.off = keep === undefined ? !o.off : !keep;
  chopRender();
}
function chopKeepAll(keep) { if (CH.x) { CH.opt = CH.marks.map((_, i) => ({ ...chopOpt(i), off: !keep })); chopRender(); } }
function chopSetLen(i, len) {                        /* the length of chop i in samples (0: up to the next marker) */
  if (!CH.x || i < 0 || i >= CH.marks.length) return;
  chopOpt(i).len = Math.max(0, Math.round(len));
  chopRender();
}
function chopFitAll() {                              /* shorten the longest kept chops so they all fit the slot */
  const { use } = chopUsed(), L = chopFit(use, SMP.MAX_DATA * 2 - use.length);   /* (an odd chop takes half a byte more) */
  if (!isFinite(L)) return;
  for (const c of use) if (c.end - c.start > L) chopOpt(c.i).len = L;
  sayK("chopFitted", chSecs(L));
  chopRender();
}

async function chopDecode(buf) {                    /* any file the browser decodes -> mono Float64 at SMP.RATE */
  try { const w = parseWav(buf); return resample(w.x, w.sr, SMP.RATE); } catch (e) { /* not a plain WAV */ }
  const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ab = await new Ctx(1, 1, SMP.RATE).decodeAudioData(buf.slice(0));
  const x = new Float64Array(ab.length);
  for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let i = 0; i < d.length; i++) x[i] += d[i] / ab.numberOfChannels; }
  return x;
}

async function chopLoad(f) {
  chopStop();
  try {
    const x = await chopDecode(await f.arrayBuffer());
    if (!x.length) throw new Error("no audio");
    CH.x = x;
    CH.nov = chopNovelty(x);
    CH.name = f.name.replace(/\.[^.]*$/, "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || "CHOP";
    CH.marks = [];
    CH.opt = [];
    CH.sel = -1;
    CH.v0 = 0;
    CH.v1 = x.length;
    sayK("chopLoaded", `${f.name} (${chSecs(x.length)})`);
  } catch (e) { sayK("smpDecodeFail", `${f.name} (${e.message})`); }
  chopRender();
}

/* new markers; opt (aligned with m) their options, else each keeps the options of the marker it was */
function chopSetMarks(m, opt = null) {
  const was = new Map(CH.marks.map((v, i) => [v, CH.opt[i]])), seen = new Set(), pairs = [];
  m.forEach((v, i) => {
    const p = Math.max(0, Math.min(CH.x.length - 1, Math.round(v)));
    if (seen.has(p)) return;
    seen.add(p);
    const o = opt ? opt[i] : was.get(p);
    pairs.push([p, o ? { ...o } : { off: false, len: 0 }]);
  });
  pairs.sort((a, b) => a[0] - b[0]);
  CH.marks = pairs.map((q) => q[0]);
  CH.opt = pairs.map((q) => q[1]);
  if (CH.sel >= CH.marks.length) CH.sel = CH.marks.length - 1;
  chopRender();
}
function chopAdd(pos) {                              /* a new marker; one within 30 ms is moved there instead */
  const near = CH.marks.findIndex((m) => Math.abs(m - pos) < 0.03 * chR());
  const m = CH.marks.slice(), opt = CH.marks.map((_, i) => CH.opt[i]);
  if (near >= 0) m[near] = pos; else { m.push(pos); opt.push(null); }
  chopSetMarks(m, opt);
  CH.sel = CH.marks.indexOf(Math.round(pos));
  chopDraw();
}

/* ---- audio */
function chopCtx() {
  if (!CH.ctx) CH.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (CH.ctx.state === "suspended") CH.ctx.resume();
  return CH.ctx;
}
function chopBuffer(a, b) {
  const ctx = chopCtx(), n = Math.max(1, b - a), buf = ctx.createBuffer(1, n, SMP.RATE), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = CH.x[a + i];
  return buf;
}
function chopStop() {
  if (CH.src) { try { CH.src.stop(); } catch (e) { /* ended */ } CH.src = null; }
  cancelAnimationFrame(CH.raf);
  if (CH.ui) { CH.ui.play.textContent = t("chopPlay"); chopDraw(); }
}
/* play a..b; whole = the transport (a playhead, TAP marks), else an audition */
function chopPlay(a, b, whole) {
  if (!CH.x) return;
  chopStop();
  const ctx = chopCtx(), src = ctx.createBufferSource();
  const g = ctx.createGain();
  src.buffer = chopBuffer(a, b);
  src.connect(g).connect(ctx.destination);
  if (!whole) {                                     /* the fades the slot will have */
    const n = b - a, fo = Math.min(CHOP.FADE_OUT, n >> 2) / SMP.RATE, now = ctx.currentTime + 0.005, end = now + n / SMP.RATE;
    g.gain.setValueAtTime(1, now);
    g.gain.setValueAtTime(1, Math.max(now, end - fo));
    g.gain.linearRampToValueAtTime(0, end);
  }
  CH.t0 = ctx.currentTime + 0.005 - a / SMP.RATE;
  src.start(ctx.currentTime + 0.005);
  src.onended = () => { if (CH.src === src) { CH.src = null; if (whole) chopStop(); } };
  CH.src = src;
  CH.src.whole = whole;
  if (whole) {
    CH.ui.play.textContent = t("chopStop");
    const tick = () => { chopDraw(); if (CH.src === src) CH.raf = requestAnimationFrame(tick); };
    CH.raf = requestAnimationFrame(tick);
  }
}
/* where the listener is now, in samples (what comes out of the speakers, not what is computed) */
function chopHeard(ev) {
  const ctx = CH.ctx;
  let ct = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
  if (ev && ctx.getOutputTimestamp) {
    const ts = ctx.getOutputTimestamp();
    if (ts.performanceTime > 0) ct = ts.contextTime + (ev.timeStamp - ts.performanceTime) / 1000;
  }
  return (ct - CH.t0) * SMP.RATE;
}
function chopTap(ev) {                               /* TAP while it plays: a marker on the hit you meant */
  if (!CH.src || !CH.src.whole) return;
  const p = chopHeard(ev);
  if (p < 0 || p >= CH.x.length) return;
  chopAdd(CH.ui.snap.checked ? chopSnap(CH.x, CH.nov, p) : Math.round(p));
}
function chopAudition(i) {
  const c = chopChops()[i];
  if (!c) return;
  CH.sel = i;
  chopPlay(c.start, c.end, false);
  chopRender();
}

/* ---- drawing (the page's own two colours) */
function chopDraw() {
  const u = CH.ui;
  if (!u) return;
  const cv = u.cv, dpr = window.devicePixelRatio || 1, W = Math.max(200, cv.clientWidth), Hh = 150;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); }
  const g = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
  const FG = cs.getPropertyValue("--fg").trim(), DIM = cs.getPropertyValue("--dim").trim(), LINE = cs.getPropertyValue("--line").trim();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, Hh);
  if (!CH.x) { g.fillStyle = DIM; g.font = "12px sans-serif"; g.fillText(t("chopDrop"), 8, Hh / 2); return; }
  const x = CH.x, v0 = CH.v0, span = CH.v1 - CH.v0, X = (p) => (p - v0) / span * W, mid = Hh / 2 + 6;
  const U = chopUsed(), { all: chops, use } = U;
  const hatch = (a, b) => {                          /* what the slot does not get */
    g.save(); g.beginPath(); g.rect(a, 12, b - a, Hh - 12); g.clip(); g.strokeStyle = LINE;
    for (let q = Math.floor(a / 8) * 8 - 8; q < b; q += 8) { g.beginPath(); g.moveTo(q, Hh); g.lineTo(q + 8, 12); g.stroke(); }
    g.restore();
  };
  if (chops.length && chops[0].start > 0) hatch(X(0), X(chops[0].start));
  chops.forEach((c, i) => {                          /* the chops: the selected one filled, left-out parts hatched */
    const a = X(c.start), b = X(c.end), f = X(c.full);
    if (f < 0 || a > W) return;
    if (i === CH.sel) { g.fillStyle = LINE; g.fillRect(a, 12, b - a, Hh - 12); }
    if (!use.includes(c)) hatch(a, f); else if (c.end < c.full) hatch(b, f);
  });
  g.fillStyle = FG;
  for (let px = 0; px < W; px++) {                   /* the wave: min / max per pixel */
    const a = Math.floor(v0 + px / W * span), b = Math.min(x.length, Math.max(a + 1, Math.floor(v0 + (px + 1) / W * span)));
    let lo = 0, hi = 0;
    for (let i = a; i < b; i += Math.max(1, (b - a) >> 6)) { if (x[i] < lo) lo = x[i]; if (x[i] > hi) hi = x[i]; }
    g.fillRect(px, mid - hi * (Hh / 2 - 8), 1, Math.max(1, (hi - lo) * (Hh / 2 - 8)));
  }
  g.font = "10px sans-serif";
  CH.marks.forEach((m, i) => {                       /* the markers, numbered; the chop's key above */
    const px = X(m);
    if (px < -1 || px > W + 1) return;
    g.fillStyle = FG;
    g.fillRect(Math.round(px), 0, i === CH.sel ? 2 : 1, Hh);
    g.fillText(String(i + 1) + chopKeyName(U, i), px + 3, 10);
  });
  const sc = chops[CH.sel];
  if (sc) {                                          /* the selected chop's end: a handle at the bottom, drag it */
    const px = Math.round(X(sc.end));
    g.fillStyle = FG;
    g.fillRect(px - 1, Hh - 30, 2, 30);
    g.beginPath(); g.moveTo(px, Hh - 30); g.lineTo(px - 7, Hh - 38); g.lineTo(px - 7, Hh - 22); g.closePath(); g.fill();
  }
  if (CH.src && CH.src.whole && CH.ctx) {            /* the playhead, as heard */
    const p = X(chopHeard());
    g.fillStyle = DIM;
    g.fillRect(Math.round(p), 12, 1, Hh - 12);
  }
}

/* ---- the block */
function chopUI() {
  const box = $("chop");
  if (!box || CH.ui) return;
  const u = CH.ui = {};
  const file = el("input", { type: "file", accept: "audio/*,.wav,.mp3,.aif,.aiff,.flac,.ogg,.m4a", hidden: true });
  file.addEventListener("change", () => { if (file.files[0]) chopLoad(file.files[0]); file.value = ""; });
  u.info = el("span", { class: "dim" });
  u.cv = el("canvas", { class: "wave", tabindex: "0", title: t("chopHint") });
  u.play = el("button", { onclick: () => { if (CH.src && CH.src.whole) chopStop(); else if (CH.x) chopPlay(Math.round(CH.v0), CH.x.length, true); } }, t("chopPlay"));
  u.tap = el("button", { class: "tap", onpointerdown: (e) => { e.preventDefault(); chopTap(e); } }, t("chopTap"));
  u.snap = el("input", { type: "checkbox", checked: true });

  u.div = el("select", {}, ...[["1 bar", 4], ["1/2", 2], ["1/4", 1], ["1/8", 0.5], ["1/16", 0.25]].map(([n, v]) => el("option", { value: v, text: n })));
  u.div.value = "1";
  u.n = el("select", {}, ...[2, 3, 4, 6, 8, 12, 16].map((n) => el("option", { value: n, text: String(n) })));
  u.n.value = "8";
  u.key = el("select", {}, ...Array.from({ length: 49 }, (_, i) => 36 + i).map((n) => el("option", { value: n, text: noteName(n) })));
  u.key.value = String(CH.key0);
  u.mode = el("select", {}, el("option", { value: 0, text: t("chopModeKeys") }), el("option", { value: 1, text: t("chopModeOne") }));
  u.max = el("select", {}, ...[["—", 0], ["0.25 s", 0.25], ["0.5 s", 0.5], ["1 s", 1], ["2 s", 2]].map(([n, v]) => el("option", { value: v, text: n })));
  u.meter = el("progress", { max: SMP.MAX_DATA * 2, value: 0 });
  u.room = el("span", { class: "dim" });
  u.list = el("div", { class: "chops" });
  /* the selected chop: keep it or not, its length; and all of them at once */
  u.selName = el("b", { class: "selname" });
  u.keep = el("input", { type: "checkbox", onchange: () => chopKeep(CH.sel, u.keep.checked) });
  u.len = el("input", { type: "range", class: "len", min: 10, max: 1000, step: 1, title: t("chopLen"),
    oninput: () => { const c = chopChops()[CH.sel]; if (c) { const ms = +u.len.value, full = c.full - c.start; chopSetLen(CH.sel, ms >= Math.floor(full / SMP.RATE * 1000) ? 0 : ms * SMP.RATE / 1000); } } });
  u.lenTxt = el("span", { class: "dim" });
  u.selPlay = el("button", { onclick: () => chopAudition(CH.sel) }, "▶");
  u.full = el("button", { onclick: () => chopSetLen(CH.sel, 0) }, t("chopFull"));
  u.selRow = el("div", { class: "head selrow" }, u.selName, el("label", {}, u.keep, " " + t("chopKeep")),
    el("span", { text: t("chopLen") }), u.len, u.lenTxt, u.selPlay, u.full);

/* ---------------------------------------------------------- mixer (v3) --- */
/* dev.mix = TRACK reply + pan per track ({sel, ntrk, tracks: [{engine, preset, level, mute, armed, pan}]}).

   The selected track's level / pan / mute are also Sound parameters: both views follow each other. */
let mixDrag = null;                 /* "lv:i" / "pan:i" while a strip control is dragged */
const mixEdit = new Map();          /* "lv:i" / "pan:i" -> time of the user's last change */
const mixCtl = [];                  /* per track: the strip's elements */

const mixTouched = (kind, i) => mixDrag === `${kind}:${i}` || performance.now() - (mixEdit.get(`${kind}:${i}`) || 0) < 600
  || (!!dev && kind === "lv" && dev.link.hasQueued("mix:" + i))
  || (kind === "pan" && (panWant.has(i) || (!!dev && dev.link.hasQueued("pan:" + i))));

function trackName(x) {

}

async function readMixer() {
  const d = dev;
  if (!d || !hasTracks()) return;
  const m = await mixer.read(rq, d.info, { pan: pPan() });
  if (d !== dev) return;
  if (d.mix) m.tracks.forEach((x, i) => {           /* what the user is moving stays */
    const o = d.mix.tracks[i];
    if (!o) return;
    if (mixTouched("lv", i)) { x.level = o.level; x.mute = o.mute; }
    if (mixTouched("pan", i)) x.pan = o.pan;

  renderMixer();

/* the Sound view's values of the selected track (and the drum level, a global) -> the strips */
function mixFromDump() {

window.addEventListener("pointerup", () => { mixDrag = null; });
window.addEventListener("pointercancel", () => { mixDrag = null; });

/* level and mute: TRACK_MIX, one in flight per track and one queued with the latest values (as SET) */
function setLevel(i, v) {

const panWant = new Map();

      const arr = c.scope ? d.dump.g : d.dump.p;

      else if (c.id === pMute()) { if (!mixTouched("lv", c.track)) x.mute = c.value ? 1 : 0; }

/* keep-alive: PING when nothing else went out for ~1 s; after a longer gap (hidden tab, a long flash
   write: Link.onGap) the watch may have ended: WATCH again and re-read what may have been missed */
let rewatch = false;
async function keepAlive() {
  const d = dev;
  if (!d || !d.watch || !d.dump || document.hidden) return;
  const gap = Date.now() - d.link.lastSent;
  if (rewatch || gap > 2500) {
    if (keepAlive.run) return;
    keepAlive.run = true;
    try {
      const on = await startWatch((r, o) => d.link.request(r, o));
      rewatch = false;                              /* (this WATCH itself may have flagged the gap) */
      if (on) { d.v4 = on === 3; needReload = true; maybeReload(); }
      else if (d === dev) { d.watch = false; renderLive(); }
    } catch (e) { /* closed */ } finally { keepAlive.run = false; }
  } else if (gap > 850 && d.link.idle) {
    d.link.request(req.ping(), { key: "ping", quiet: true, retries: 0 }).catch(() => {});
  }
}
setInterval(keepAlive, 1000);
